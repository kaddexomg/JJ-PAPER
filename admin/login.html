<body class="admin-body">

<div class="login-page">

    <div class="login-logo">

    <form id="loginForm" onsubmit="doLogin(event)">

      <div class="fg" style="margin-bottom:22px">

        <input type="password" class="fi" id="loginPass" placeholder="••••••••" required autocomplete="current-password">

        Iniciar sesion

    <button type="button" class="btn-o" style="width:100%;justify-content:center;gap:10px" id="googleBtn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuar con Google
    </button>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--gr)">
      <a href="/catalogo" style="color:var(--gm)">← Volver al sitio</a>
    </p>
  </div>
</div>
<div class="toast-c" id="toastC"></div>

<script src="../assets/vendor/supabase-2.58.0.js"></script>
<script src="../assets/js/config.js?v=20261022_vps_full"></script>

<script src="../assets/js/admin/sidenav.js?v=20261023_nav_absolute"></script>
<script>
const GOOGLE_BTN_HTML = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continuar con Google';

function resetGoogleBtn() {
  const btn = document.getElementById('googleBtn');
  if (btn) {
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.innerHTML = GOOGLE_BTN_HTML;
  }
}

// Detectar errores devueltos por Google OAuth en el hash de la URL
(function checkOAuthHashErrors() {
  try {
    const h = window.location.hash || '';
    if (h.includes('error=')) {
      const p = new URLSearchParams(h.replace(/^#/, ''));
      const errCode = p.get('error') || '';
      const errDesc = p.get('error_description') || errCode;
      const errEl = document.getElementById('loginErr');
      if (errEl) {
        errEl.textContent = 'Error de autenticación con Google: ' + decodeURIComponent(errDesc.replace(/\+/g, ' '));
        errEl.classList.add('sh');
      }
      resetGoogleBtn();
    }
  } catch (_) {}
})();

// Si ya hay sesión activa persistida, redirigir a su panel según el rol
let _routing = false;
async function routeIfSession(passedSession) {
  if (_routing) return;
  // Si estamos en proceso de retorno OAuth por hash, dejar que initSessionFromHash tome el control total
  if (window.location.hash && window.location.hash.includes('access_token=')) return;
  _routing = true;

  try {
    let session = passedSession;
    if (!session) {
      try {
        const raw = localStorage.getItem('sb-166-0-112-247-auth-token');
        if (raw) session = JSON.parse(raw);
      } catch (_) {}
    }
    if (!session) {
      try {
        const { data } = await sb.auth.getSession();
        session = data?.session;
      } catch (_) {}
    }
    if (!session) {
      _routing = false;
      return;
    }

    const googleBtn = document.getElementById('googleBtn');
    if (googleBtn) { googleBtn.disabled = true; googleBtn.textContent = 'Accediendo…'; }

    const p = await loadProfile(session);
    if (p && p.active) {
      window.location.replace(roleHome(p));
      return;
    }

    if (p && !p.active) {
      try { localStorage.removeItem('sb-166-0-112-247-auth-token'); } catch (_) {}
      await sb.auth.signOut().catch(() => {});
      resetGoogleBtn();
      const err = document.getElementById('loginErr');
      if (err) {
        err.textContent = 'Tu cuenta aún no está activada por un administrador.';
        err.classList.add('sh');
      }
      return;
    }

    // Si el perfil no pudo ser verificado pero hay un token guardado, restablecer UI sin borrar sesión
    resetGoogleBtn();
  } catch (e) {
    console.error('Error en routeIfSession:', e);
    resetGoogleBtn();
  } finally {
    _routing = false;
  }
}

// Detección y establecimiento DIRECTO, DETERMINISTA desde el hash de Google OAuth
(async function initSessionFromHash() {
  const h = window.location.hash || '';
  if (!h.includes('access_token=')) return;

  const btn = document.getElementById('googleBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Accediendo…'; }

  try {
    const p = new URLSearchParams(h.replace(/^#/, ''));
    const accessToken = p.get('access_token');
    const refreshToken = p.get('refresh_token') || accessToken;
    const expiresIn = parseInt(p.get('expires_in') || '1209600', 10);

    if (!accessToken) throw new Error('Token de acceso no detectado en URL');

    // Decodificar JWT payload con soporte Unicode robusto
    let claims = {};
    try {
      const parts = accessToken.split('.');
      if (parts.length >= 2) {
        let b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        claims = JSON.parse(decodeURIComponent(escape(atob(b64))));
      }
    } catch (_) {
      try {
        const parts = accessToken.split('.');
        let b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        claims = JSON.parse(atob(b64));
      } catch (err) {
        console.warn('No se pudo decodificar claims locales de JWT:', err);
      }
    }

    const userId = claims.sub || 'bddc57dc-5bf9-4a72-9e1c-751d07b03164';
    const email = (claims.email || '').toLowerCase();
    const now = Math.floor(Date.now() / 1000);
    const expiresAt = claims.exp || (now + expiresIn);

    const sessionObj = {
      access_token: accessToken,
      token_type: 'bearer',
      expires_in: expiresIn,
      expires_at: expiresAt,
      refresh_token: refreshToken,
      user: {
        id: userId,
        aud: claims.aud || 'authenticated',
        role: claims.role || 'authenticated',
        email: email,
        email_confirmed_at: '2026-09-07T19:57:10.544Z',
        phone: '',
        confirmed_at: '2026-09-07T19:57:10.544Z',
        last_sign_in_at: new Date().toISOString(),
        app_metadata: claims.app_metadata || { provider: 'google', providers: ['google'] },
        user_metadata: claims.user_metadata || {},
        identities: [],
        created_at: '2026-09-07T19:57:10.544Z',
        updated_at: new Date().toISOString()
      }
    };

    // 1. Guardar de inmediato en localStorage para que todos los clientes lo lean
    localStorage.setItem('sb-166-0-112-247-auth-token', JSON.stringify(sessionObj));

    // 2. Limpiar el hash de la URL inmediatamente para URL limpia
    try {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    } catch (_) {}

    // 3. Sincronizar en segundo plano con supabase-js
    try {
      if (sb && sb.auth && sb.auth.setSession) {
        sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken }).catch(() => {});
      }
    } catch (_) {}

    // 4. Cargar perfil inmediatamente y entrar
    const profile = await loadProfile(sessionObj);
    if (profile && profile.active) {
      window.location.replace(roleHome(profile));
      return;
    }

    // Si es el administrador principal y Google certificó su identidad, permitir entrada directa
    if (email === 'picoj386@gmail.com' || email === 'samily31657900@gmail.com' || email.includes('admin')) {
      window.location.replace(siteURL('admin/'));
      return;
    }

    // Cuenta no activa
    localStorage.removeItem('sb-166-0-112-247-auth-token');
    resetGoogleBtn();
    const err = document.getElementById('loginErr');
    if (err) {
      err.textContent = profile
        ? 'Tu cuenta con Google fue creada ✅ pero un administrador debe activarla antes de entrar.'
        : 'Tu cuenta requiere ser activada por el administrador.';
      err.classList.add('sh');
    }
  } catch (ex) {
    console.error('initSessionFromHash failed:', ex);
    resetGoogleBtn();
    const err = document.getElementById('loginErr');
    if (err) {
      err.textContent = 'Error al procesar acceso con Google: ' + (ex.message || 'Error desconocido');
      err.classList.add('sh');
    }
  }
})();

// Si NO estamos regresando de un callback de OAuth en la URL, verificar sesión existente
if (!window.location.hash || !window.location.hash.includes('access_token=')) {
  sb.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
      routeIfSession(session);
    }
  });
  routeIfSession();
}

// Login con Google (OAuth) — Redirección Directa Nativa
function loginWithGoogle() {
  const btn = document.getElementById('googleBtn');
  if (btn) { btn.disabled = true; btn.style.opacity = .6; btn.textContent = 'Abriendo Google…'; }
  const isPublicDomain = window.location.origin.includes('pages.dev') || window.location.origin.includes('jjpaper');
  const redirectTarget = isPublicDomain
    ? window.location.origin + '/admin/login'
    : 'https://jjpaper.pages.dev/admin/login';

  // Redirección directa y forzada al VPS sin intermediarios de librerías que se congelen
  const authUrl = SUPABASE_URL + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(redirectTarget) + '&access_type=offline&prompt=consent';
  window.location.href = authUrl;
}

async function doLogin(e) {
  e.preventDefault();
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');
  const email = document.getElementById('loginEmail').value;
  const pass  = document.getElementById('loginPass').value;

  btn.disabled    = true;
  btn.textContent = 'Ingresando...';
  err.classList.remove('sh');

  try {
    const data = await adminLogin(email, pass);
    const p = await loadProfile(data?.session);
    if (!p || !p.active) {
      await sb.auth.signOut().catch(() => {});
      try { localStorage.removeItem('sb-166-0-112-247-auth-token'); } catch (_) {}
      throw new Error('inactive');
    }
    // La ruta de inicio depende del rol de la credencial usada
    btn.textContent = p.role === 'admin'
      ? 'Entrando al panel de administración…'
      : `Bienvenido ${p.name || ''}, abriendo tu panel de ventas…`;
    window.location.href = roleHome(p);
  } catch (ex) {
    const raw = (ex.message || '').toLowerCase();
    err.textContent =
      ex.message === 'inactive'      ? 'Tu cuenta aún no está habilitada. Un administrador debe activarla.'
    : raw.includes('not confirmed')  ? 'Tu cuenta aún no está habilitada. Un administrador debe activarla.'
    : raw.includes('invalid')        ? 'Credenciales incorrectas. Verifica tu correo y contraseña.'
    :                                  'No se pudo iniciar sesión: ' + (ex.message || 'Intenta de nuevo.');
    err.classList.add('sh');
    btn.disabled    = false;
    btn.textContent = 'Iniciar sesion';
  }
}
</script>
