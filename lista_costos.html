<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Costos | JJ Paper</title>
<link rel="icon" href="assets/img/logo.svg">
<style>
  :root { --doc-c:#16604A; --doc-a:#C9A24B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#1a1a1a; background:#eef1f0; padding:15px; }
  .sheet { max-width:920px; margin:0 auto; background:#fff; padding:18px 24px; border-radius:8px;
    box-shadow:0 4px 24px rgba(0,0,0,.1); }
  .cmp-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    border-bottom:2px solid var(--doc-c); padding-bottom:8px; margin-bottom:8px; }
  .cmp-biz { display:flex; gap:10px; align-items:center; }
  .cmp-biz img { width:42px; height:42px; object-fit:contain; }
  .cmp-biz h1 { font-size:16px; color:var(--doc-c); line-height:1.1; }
  .cmp-biz .meta { font-size:10px; color:#555; margin-top:1px; line-height:1.2; }
  .cmp-doc { text-align:right; }
  .cmp-doc .tag { display:inline-block; background:var(--doc-c); color:#fff; font-weight:700;
    font-size:11px; padding:2px 7px; border-radius:3px; letter-spacing:.4px; }
  .cmp-doc .date { font-size:10px; color:#555; margin-top:2px; }

  .cat-section { margin-top:6px; margin-bottom:2px; break-inside:auto; page-break-inside:auto; }
  .cat-header { background:var(--doc-c); color:#fff; font-size:11px; font-weight:700; padding:2.5px 6px; border-radius:2px; margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; break-after:avoid; page-break-after:avoid; }
  
  table { width:100%; border-collapse:collapse; margin-bottom:2px; break-inside:auto; page-break-inside:auto; }
  thead th { background:#edf3f0; color:var(--doc-c); font-size:9.5px; text-align:left; padding:2px 5px; border-bottom:1.5px solid var(--doc-c); font-weight:700; }
  thead th.r { text-align:right; } thead th.c { text-align:center; }
  tbody tr { break-inside:avoid; page-break-inside:avoid; }
  tbody td { padding:1.5px 5px; border-bottom:1px solid #f0f3f1; font-size:10px; line-height:1.18; }
  tbody td.r { text-align:right; font-weight:600; } tbody td.c { text-align:center; }
  tbody tr:nth-child(even) { background:#fafcfb; }

  .cmp-foot { margin-top:10px; border-top:1px solid #e5e9e7; padding-top:6px; font-size:9.5px; color:#777; text-align:center; }
  .toolbar { max-width:920px; margin:0 auto 10px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; align-items:center; }
  /* Controles de la barra (no se imprimen) */
  .tb-field { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--doc-c); font-weight:700; }
  .tb-field select { border:1px solid #cdd6d2; border-radius:5px; padding:5px 8px; font-size:12px;
    font-weight:600; color:#1a1a1a; background:#fff; min-height:32px; cursor:pointer; }
  .tb-check { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--doc-c);
    font-weight:600; cursor:pointer; min-height:32px; }
  .tb-warn { max-width:920px; margin:0 auto 8px; background:#fff8e6; border:1px solid #e8c96b;
    border-radius:6px; padding:6px 10px; font-size:11.5px; color:#6b5518; }
  .tb-warn strong { color:#8a6d16; }
  /* Existencia en modo cliente: "A pedido" en latón, nunca en rojo de alarma */
  .st-pedido { color:var(--doc-a); font-weight:700; }
  .st-ok { color:#0a7; font-weight:700; }
  .btn { border:0; border-radius:5px; padding:6px 13px; font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn-p { background:var(--doc-c); color:#fff; }
  .btn-g { background:#dfe5e2; color:var(--doc-c); }
  .loading, .err { max-width:920px; margin:30px auto; text-align:center; color:#555; }
  .err { color:#b00; }

  @media print {
    /* Conserva los fondos de color y márgenes compactos para A4/Carta */
    @page { margin:7mm 9mm 7mm 9mm; size:letter portrait; }
    html, body {
      background:#fff !important;
      padding:0 !important;
      margin:0 !important;
      width:100% !important;
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
    }
    .sheet {
      box-shadow:none !important;
      border-radius:0 !important;
      max-width:none !important;
      width:100% !important;
      padding:0 !important;
      margin:0 !important;
    }
    .toolbar, .tb-warn { display:none !important; }

    /* Encabezado y pie de página limpios */
    .cmp-head { break-inside:avoid !important; page-break-inside:avoid !important; margin-bottom:6px !important; padding-bottom:6px !important; }
    .cmp-foot { break-inside:avoid !important; page-break-inside:avoid !important; margin-top:8px !important; padding-top:4px !important; font-size:8.5px !important; }

    table {
      width:100% !important;
      border-collapse:collapse !important;
      page-break-inside:auto;
      margin-bottom:2px !important;
    }
    thead {
      display:table-header-group !important; /* Repite encabezados en cada página */
      break-inside:avoid !important;
      page-break-inside:avoid !important;
    }
    thead tr, thead th {
      break-inside:avoid !important;
      page-break-inside:avoid !important;
      background:#edf3f0 !important;
      -webkit-print-color-adjust:exact !important;
      padding:1.5px 4px !important;
      font-size:8.5px !important;
    }
    tbody {
      page-break-inside:auto;
    }
    tbody tr {
      break-inside:avoid !important;
      page-break-inside:avoid !important; /* Cada fila se mantiene entera, jamás se corta en dos */
    }
    td, th {
      word-break:break-word;
    }
    tbody td {
      font-size:9px !important;
      padding:1.5px 4px !important;
      line-height:1.15 !important;
    }
    .cat-section {
      break-inside:auto;
      page-break-inside:auto;
      margin-top:6px !important;
      margin-bottom:2px !important;
    }
    .cat-header {
      break-after:avoid !important;
      page-break-after:avoid !important; /* Nunca dejar el título huérfano */
      break-inside:avoid !important;
      page-break-inside:avoid !important;
      padding:2px 5px !important;
      font-size:9.5px !important;
      -webkit-print-color-adjust:exact !important;
    }
  }
</style>
</head>
<body>
<div class="toolbar" id="toolbar" style="display:none">
  <input type="search" id="tbSearch" placeholder="Buscar producto, marca o SKU…" oninput="onSearchCost(this.value)"
    style="flex:1 1 200px;min-width:170px;border:1px solid #cdd6d2;border-radius:6px;padding:8px 12px;font-size:13px"
    aria-label="Buscar producto, marca o SKU">

  <!-- Preset: ajusta de un golpe todo lo que el cliente NO debe ver -->
  <label class="tb-field">
    <span>Lista para</span>
    <select id="tbPreset" onchange="onPreset(this.value)" aria-label="Para quién es la lista">
      <option value="cliente">🤝 Cliente</option>
      <option value="interno">🔒 Uso interno</option>
    </select>
  </label>

  <!-- Nivel de Precio a imprimir / consultar -->
  <label class="tb-field">
    <span>Nivel</span>
    <select id="tbPriceLevel" onchange="onPriceLevel(this.value)" aria-label="Nivel de precio">
      <option value="B" selected>🔖 Precio B (Mayorista USD) [Oficial]</option>
      <option value="A">🔖 Precio A (Detal USD)</option>
      <option value="D">🇻🇪 Precio D (Mayorista Bs)</option>
      <option value="C">🇻🇪 Precio C (Detal Bs)</option>
    </select>
  </label>

  <!-- Organización por Categoría, Segmento o Lista corrida -->
  <label class="tb-field">
    <span>Organizar</span>
    <select id="tbGroup" onchange="onGroupMode(this.value)" aria-label="Cómo agrupar los productos">
      <option value="letra">🔤 Por Letra Inicial (A - Z)</option>
      <option value="categoria">📂 Por Categoría</option>
      <option value="segmento">🔖 Por Segmento / Familia</option>
      <option value="plano">📋 Lista continua (Sin agrupar)</option>
    </select>
  </label>

  <!-- Botón simple para ordenar A-Z -->
  <button class="btn btn-p" id="tbAlphaSortBtn" onclick="toggleAlphaSort()"
    title="Orden alfabético A-Z activado. Clic para conmutar a orden de catálogo.">🔤 Orden A-Z</button>

  <!-- Cómo se muestra la existencia. "A pedido" es la clave del negocio: un
       producto en cero se le puede pedir al proveedor, así que decirle al
       cliente "Agotado" tumba una venta que sí se podía hacer. -->
  <label class="tb-field">
    <span>Existencia</span>
    <select id="tbStock" onchange="onStockMode(this.value)" aria-label="Cómo mostrar la existencia">
      <option value="oculta">No mostrar</option>
      <option value="pedido">Disponible / A pedido</option>
      <option value="numeros">Cantidades exactas</option>
    </select>
  </label>

  <label class="tb-check" id="tbZeroWrap">
    <input type="checkbox" id="tbZero" onchange="onToggleZero(this)"> Quitar los que están en cero
  </label>

  <!-- Control de formato de impresión: Continuo compacto protegido o salto forzado -->
  <label class="tb-field">
    <span>Impresión</span>
    <select id="tbPageBreak" onchange="onPageBreakMode(this.value)" aria-label="Ajuste de hojas para impresión">
      <option value="auto">📄 Óptimo / Compacto (13 a 15 páginas sin cortes)</option>
      <option value="hojas">📑 Una hoja por sección (Modo extendido)</option>
    </select>
  </label>

  <button class="btn btn-g" onclick="refrescarLista()" id="tbRefresh"
    title="Vuelve a leer precios y existencias de la base (para la lista del día)">🔄 Actualizar</button>
  <button class="btn btn-p" onclick="window.print()">🖨️ Imprimir Lista</button>
  <button class="btn btn-g" onclick="window.close()">Cerrar</button>
</div>

<div id="content"><div class="loading">Cargando lista de costos…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin/auth.js"></script>
<script>
(async () => {
  const content = document.getElementById('content');
  // La lista de COSTOS (?mode=cost) es confidencial: solo admin. La lista de
  // PRECIOS al público la puede abrir cualquier vendedor.
  const needAdmin = new URLSearchParams(location.search).get('mode') === 'cost';
  const session = await requireAuth(needAdmin ? 'admin' : 'vendedor');
  if (!session) return;
  await loadSettings();
  applyDocTheme();

  await cargarVariantes(content);
  if (!ALL_VARIANTS.length && content.querySelector('.err')) return;

  // Arranque: en la lista al cliente NUNCA se delata el stock. En la interna
  // (?mode=cost) sí interesan las cantidades exactas.
  const isCost = new URLSearchParams(location.search).get('mode') === 'cost';
  aplicarPreset(isCost ? 'interno' : 'cliente', true);

  // ?q=<texto> llega desde "Consultar stock": imprime solo lo buscado
  const preQ = new URLSearchParams(location.search).get('q') || '';
  if (preQ) {
    FILTER_SEARCH = preQ;
    const box = document.getElementById('tbSearch');
    if (box) box.value = preQ;
  }
  applyFilters();
  document.getElementById('toolbar').style.display = 'flex';
})();

// Estado de filtros (barra de herramientas, no se imprime)
let ALL_VARIANTS = [];
let FILTER_HIDE_ZERO = false;
let FILTER_SEARCH = '';
let PRICE_LEVEL = 'B';         // B (Mayorista USD - oficial) | A (Detal USD) | D (Mayorista Bs) | C (Detal Bs)
let STOCK_MODE = 'pedido';     // oculta | pedido | numeros
let GROUP_MODE = 'letra';      // letra | categoria | segmento | plano
let PAGE_BREAK_MODE = 'auto';  // auto (óptimo 13-15 páginas) | hojas (extendido)
let IS_ALPHA_SORT = true;      // true: A-Z | false: por orden de catálogo
let GENERADA_EN = null;        // fecha/hora de la última lectura de la base

function onPriceLevel(v) { PRICE_LEVEL = v; applyFilters(); }

// Lee precios y existencias. Separado para poder REFRESCAR sin recargar la
// página: la lista del día se actualiza con un botón.
async function cargarVariantes(content) {
  const selWithGroups = 'id,sku,cost_usd,price_usd,price_a,price_b,price_c_bs,price_d_bs,stock,variant_name,jjp_brands(name),'
    + 'jjp_products(name,price_usd,price_a,price_b,price_c_bs,price_d_bs,cost_usd,jjp_categories(name,sort_order,jjp_category_groups(name,emoji,sort_order)))';
  const selFallback = 'id,sku,cost_usd,price_usd,price_a,price_b,price_c_bs,price_d_bs,stock,variant_name,jjp_brands(name),'
    + 'jjp_products(name,price_usd,price_a,price_b,price_c_bs,price_d_bs,cost_usd,jjp_categories(name,sort_order))';
  const selBasic = 'id,sku,cost_usd,price_usd,price_a,price_b,price_c_bs,price_d_bs,stock,variant_name,jjp_brands(name),'
    + 'jjp_products(name,price_usd,price_a,price_b,price_c_bs,price_d_bs,cost_usd)';

  let activeSel = selWithGroups;
  const out = [], CHUNK = 1000;
  for (let from = 0; ; from += CHUNK) {
    let res = await sb.from('jjp_product_variants')
      .select(activeSel)
      .eq('active', true)
      .range(from, from + CHUNK - 1);

    if (res.error && activeSel === selWithGroups) {
      console.warn('Fallback a categorías simples en lista_costos:', res.error.message);
      activeSel = selFallback;
      res = await sb.from('jjp_product_variants')
        .select(activeSel)
        .eq('active', true)
        .range(from, from + CHUNK - 1);
    }
    if (res.error && activeSel === selFallback) {
      console.warn('Fallback a productos simples en lista_costos:', res.error.message);
      activeSel = selBasic;
      res = await sb.from('jjp_product_variants')
        .select(activeSel)
        .eq('active', true)
        .range(from, from + CHUNK - 1);
    }

    if (res.error) {
      if (content) content.innerHTML = `<div class="err">Error al obtener lista de productos/costos: ${escapeHTML(res.error.message)}</div>`;
      console.error('Error cargando variantes en lista_costos:', res.error);
      return false;
    }
    out.push(...(res.data || []));
    if (!res.data || res.data.length < CHUNK) break;
  }
  ALL_VARIANTS = out;
  GENERADA_EN = new Date();
  return true;
}

async function refrescarLista() {
  const btn = document.getElementById('tbRefresh');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Actualizando…'; }
  const ok = await cargarVariantes(null);
  if (btn) { btn.disabled = false; btn.textContent = '🔄 Actualizar'; }
  if (ok) applyFilters();
}

// Organización por Segmentos / Categorías / Plano
function onGroupMode(v) { GROUP_MODE = v; applyFilters(); }

// Conmutador del botón simple de Orden Alfabético A-Z
function toggleAlphaSort() {
  IS_ALPHA_SORT = !IS_ALPHA_SORT;
  sincronizarBotonSort();
  applyFilters();
}

function sincronizarBotonSort() {
  const btn = document.getElementById('tbAlphaSortBtn');
  if (!btn) return;
  if (IS_ALPHA_SORT) {
    btn.className = 'btn btn-p';
    btn.innerHTML = '🔤 Orden A-Z (Activo)';
    btn.title = 'Orden alfabético A-Z activado. Clic para conmutar a orden de catálogo.';
  } else {
    btn.className = 'btn btn-g';
    btn.innerHTML = '🔢 Orden Catálogo';
    btn.title = 'Orden de catálogo activado. Clic para conmutar a orden alfabético A-Z.';
  }
}

// Preset: de un golpe deja la lista lista para mandar al cliente, o para uso interno
function aplicarPreset(preset, soloEstado) {
  STOCK_MODE = preset === 'interno' ? 'numeros' : 'pedido';
  FILTER_HIDE_ZERO = false;    // en cero NO se quita: se le puede pedir al proveedor
  const p = document.getElementById('tbPreset'); if (p) p.value = preset;
  const s = document.getElementById('tbStock');  if (s) s.value = STOCK_MODE;
  const g = document.getElementById('tbGroup');  if (g) g.value = GROUP_MODE;
  const z = document.getElementById('tbZero');   if (z) z.checked = false;
  const b = document.getElementById('tbPageBreak'); if (b) b.value = PAGE_BREAK_MODE;
  sincronizarBotonSort();
  sincronizarAvisos();
  if (!soloEstado) applyFilters();
}
function onPreset(v) { aplicarPreset(v); }
function onStockMode(v) { STOCK_MODE = v; sincronizarAvisos(); applyFilters(); }
function onPageBreakMode(v) { PAGE_BREAK_MODE = v; applyFilters(); }

// Aviso claro cuando la lista muestra datos que el cliente no debería ver
function sincronizarAvisos() {
  const isCost = new URLSearchParams(location.search).get('mode') === 'cost';
  let box = document.getElementById('tbWarn');
  const peligro = STOCK_MODE === 'numeros' || isCost;
  if (!peligro) { box?.remove(); return; }
  if (!box) {
    box = document.createElement('div');
    box.id = 'tbWarn';
    box.className = 'tb-warn';
    box.setAttribute('role', 'status');
    document.getElementById('toolbar').insertAdjacentElement('afterend', box);
  }
  box.innerHTML = isCost
    ? '🔒 <strong>Documento interno:</strong> esta lista muestra COSTOS y existencias reales. No enviársela al cliente.'
    : '⚠️ <strong>Ojo:</strong> estás mostrando las cantidades exactas de inventario. Para enviarla al cliente elegí <strong>Disponible / A pedido</strong> o <strong>No mostrar</strong>.';
}

function applyFilters() {
  let rows = ALL_VARIANTS;
  if (FILTER_HIDE_ZERO) rows = rows.filter(v => (v.stock || 0) > 0);
  const q = (FILTER_SEARCH || '').trim().toLowerCase();
  if (q) rows = rows.filter(v => {
    const hay = [(v.jjp_products?.name), v.jjp_brands?.name, v.variant_name, v.sku]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  renderList(rows);
}
function onToggleZero(el) { FILTER_HIDE_ZERO = el.checked; applyFilters(); }
function onSearchCost(v) { FILTER_SEARCH = v; applyFilters(); }

function applyDocTheme() {
  const s = APP.SETTINGS || {};
  const okColor = c => /^#[0-9a-fA-F]{3,8}$/.test((c || '').trim());
  if (okColor(s.doc_color))  document.documentElement.style.setProperty('--doc-c', s.doc_color.trim());
  if (okColor(s.doc_accent)) document.documentElement.style.setProperty('--doc-a', s.doc_accent.trim());
}

function renderList(variants) {
  const s = APP.SETTINGS || {};
  const bizName  = s.business_name || s.site_name || 'JJ Paper';
  const logoUrl  = s.doc_logo_url || 'assets/img/logo.svg';

  // Permite verificar si la URL solicita modo costo (?mode=cost) o por defecto precio público
  const params = new URLSearchParams(location.search);
  const isCostMode = params.get('mode') === 'cost';
  let priceLabel = 'Precio Mayorista ($)';
  let docTitle   = 'LISTA DE PRECIOS MAYORISTA (B)';
  let docTag     = 'PRECIOS MAYORISTA (B)';

  if (isCostMode) {
    priceLabel = 'Costo Real ($)';
    docTitle   = 'LISTA DE COSTOS (INTERNA)';
    docTag     = 'USO INTERNO';
  } else if (PRICE_LEVEL === 'A') {
    priceLabel = 'Precio Detal ($)';
    docTitle   = 'LISTA DE PRECIOS DETAL (A)';
    docTag     = 'PRECIOS DETAL (A)';
  } else if (PRICE_LEVEL === 'D') {
    priceLabel = 'Precio Mayorista (Bs)';
    docTitle   = 'LISTA DE PRECIOS MAYORISTA EN BS (D)';
    docTag     = 'PRECIOS MAYORISTA BS (D)';
  } else if (PRICE_LEVEL === 'C') {
    priceLabel = 'Precio Detal (Bs)';
    docTitle   = 'LISTA DE PRECIOS DETAL EN BS (C)';
    docTag     = 'PRECIOS DETAL BS (C)';
  }

  // Tasas para conversión: BCV (Bs/USD) y euro BCV (Bs/EUR)
  const bcv = getBcvRate();
  const eurRate = getEurRate();
  const toBs  = usd => bcv ? usd * bcv : null;
  const toEur = usd => (bcv && eurRate) ? usd * bcv / eurRate : null;
  const fmtBs  = usd => { const v = toBs(usd);  return v == null ? '—' : 'Bs ' + v.toLocaleString('es-VE', { maximumFractionDigits: 2 }); };
  const fmtEur = usd => { const v = toEur(usd); return v == null ? '—' : '€ ' + v.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

  // Agrupar según GROUP_MODE: 'letra' | 'categoria' | 'segmento' | 'plano'
  const groups = {};
  const groupMeta = {};

  variants.forEach(v => {
    let gKey = '';
    let gTitle = '';
    let gSortOrder = 999;

    if (GROUP_MODE === 'letra') {
      const pName = (v.jjp_products?.name || '').trim();
      const firstChar = (pName.charAt(0) || '#').toUpperCase();
      const isLetter = /^[A-ZÁÉÍÓÚÑ]$/.test(firstChar);
      const letter = isLetter ? firstChar : '#';
      gKey = letter;
      gTitle = `Sección ${letter}`;
      gSortOrder = letter.charCodeAt(0);
    } else if (GROUP_MODE === 'segmento') {
      const segObj = v.jjp_products?.jjp_categories?.jjp_category_groups;
      const segName = segObj?.name || 'Otros Segmentos';
      const emoji = segObj?.emoji || '🔖';
      gKey = segName;
      gTitle = `${emoji} ${segName}`;
      gSortOrder = segObj?.sort_order ?? 999;
    } else if (GROUP_MODE === 'plano') {
      gKey = 'Todos los productos';
      gTitle = '📋 Catálogo completo';
      gSortOrder = 0;
    } else { // 'categoria'
      const catObj = v.jjp_products?.jjp_categories;
      const catName = catObj?.name || 'Sin Categoría';
      gKey = catName;
      gTitle = `📂 ${catName}`;
      gSortOrder = catObj?.sort_order ?? 999;
    }

    if (!groups[gKey]) {
      groups[gKey] = [];
      groupMeta[gKey] = { title: gTitle, sortOrder: gSortOrder };
    }
    groups[gKey].push(v);
  });

  // Ordenar los nombres de grupo
  const groupKeys = Object.keys(groups);
  groupKeys.sort((a, b) => {
    if (IS_ALPHA_SORT) {
      return a.localeCompare(b, 'es');
    } else {
      const orderA = groupMeta[a].sortOrder;
      const orderB = groupMeta[b].sortOrder;
      if (orderA !== orderB) return orderA - orderB;
      return a.localeCompare(b, 'es');
    }
  });

  let htmlCategories = '';
  let totalItems = 0, totalUnits = 0, totalValueUSD = 0;

  groupKeys.forEach(gKey => {
    const items = groups[gKey];
    const meta = groupMeta[gKey];

    // Ordenar productos dentro del grupo
    items.sort((a, b) => {
      const nameA = (a.jjp_products?.name || '') + ' ' + (a.jjp_brands?.name || '') + ' ' + (a.variant_name || '');
      const nameB = (b.jjp_products?.name || '') + ' ' + (b.jjp_brands?.name || '') + ' ' + (b.variant_name || '');
      if (IS_ALPHA_SORT) {
        return nameA.localeCompare(nameB, 'es');
      } else {
        const orderA = a.jjp_products?.jjp_categories?.sort_order ?? 999;
        const orderB = b.jjp_products?.jjp_categories?.sort_order ?? 999;
        if (orderA !== orderB) return orderA - orderB;
        return nameA.localeCompare(nameB, 'es');
      }
    });

    totalItems += items.length;
    let groupUnits = 0, groupValueUSD = 0;

    const rowsHtml = items.map(i => {
      const pName = escapeHTML(i.jjp_products?.name || '—');
      const bName = i.jjp_brands?.name ? ` <small style="color:#666">(${escapeHTML(i.jjp_brands.name)})</small>` : '';
      const vName = (i.variant_name && i.variant_name !== 'Única' && i.variant_name !== 'Estándar') ? ` <small style="color:#555">· ${escapeHTML(i.variant_name)}</small>` : '';

      // Mostrar la categoría si estamos agrupando por segmento o en lista plana
      const catSubTag = (GROUP_MODE !== 'categoria' && i.jjp_products?.jjp_categories?.name)
        ? ` <small style="color:#16604A;background:#eef6f3;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600;margin-left:4px">${escapeHTML(i.jjp_products.jjp_categories.name)}</small>`
        : '';

      const sku = escapeHTML(i.sku || '—');

      // Precios por nivel: Nivel B (Mayorista USD) tiene prioridad oficial
      const pB = Number(i.price_b != null ? i.price_b : (i.jjp_products?.price_b != null ? i.jjp_products.price_b : (i.price_usd != null ? i.price_usd : i.jjp_products?.price_usd))) || 0;
      const pA = Number(i.price_a != null ? i.price_a : (i.jjp_products?.price_a != null ? i.jjp_products.price_a : pB)) || pB;
      const pDBs = Number(i.price_d_bs != null ? i.price_d_bs : (i.jjp_products?.price_d_bs != null ? i.jjp_products.price_d_bs : (bcv > 0 ? pB * bcv : 0))) || 0;
      const pCBs = Number(i.price_c_bs != null ? i.price_c_bs : (i.jjp_products?.price_c_bs != null ? i.jjp_products.price_c_bs : (bcv > 0 ? pA * bcv : 0))) || 0;

      // Costo saneado: si el costo supera ampliamente el precio de venta, fue extraído en Bolívares desde MixNet
      let cUsd = Number(i.cost_usd != null ? i.cost_usd : i.jjp_products?.cost_usd) || 0;
      if (cUsd > 0 && pB > 0 && cUsd > (pB * 2.5)) {
        const implicitRate = (pDBs > 0) ? (pDBs / pB) : (bcv || 847.44);
        cUsd = Math.round((cUsd / implicitRate) * 100) / 100;
      }

      let valDisplay = pB;
      let valUSD = pB; // Para valorización de inventario en USD

      if (isCostMode) {
        valDisplay = cUsd;
        valUSD = cUsd;
      } else if (PRICE_LEVEL === 'A') {
        valDisplay = pA;
        valUSD = pA;
      } else if (PRICE_LEVEL === 'D') {
        valDisplay = pDBs;
        valUSD = pB;
      } else if (PRICE_LEVEL === 'C') {
        valDisplay = pCBs;
        valUSD = pA;
      } else { // 'B' (Por defecto: Mayorista USD)
        valDisplay = pB;
        valUSD = pB;
      }

      const stock = Number(i.stock) || 0;
      groupUnits += stock;
      groupValueUSD += valUSD * stock;

      // Cómo se muestra la existencia (ver STOCK_MODE):
      //  · numeros = cantidad exacta con semáforo (SOLO uso interno)
      //  · pedido  = "Disponible" / "A pedido" — lo que sí puede ver el cliente,
      //              porque un cero no es una venta perdida: se le pide al proveedor
      //  · oculta  = la columna no se dibuja
      const stockCell = STOCK_MODE === 'oculta' ? '' : (() => {
        if (STOCK_MODE === 'pedido') {
          return stock > 0
            ? '<td class="c st-ok">Disponible</td>'
            : '<td class="c st-pedido">A pedido</td>';
        }
        const color = stock <= 0 ? '#b00' : (stock <= 5 ? '#c08a00' : '#0a7');
        return `<td class="c" style="color:${color};font-weight:700">${stock <= 0 ? 'Agotado' : stock}</td>`;
      })();

      // Formato de celda de precio según moneda
      const isBsLevel = (PRICE_LEVEL === 'D' || PRICE_LEVEL === 'C') && !isCostMode;
      const formattedPriceCell = isBsLevel
        ? `<td class="r" style="font-weight:700">${valDisplay > 0 ? 'Bs ' + valDisplay.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—'}</td>`
        : `<td class="r" style="font-weight:700">${valDisplay > 0 ? fmtPrice(valDisplay) : '—'}</td>`;

      // Bs y € solo en modo costo (interno). La lista de precios pública = solo USD.
      const bsEurCells = isCostMode
        ? `<td class="r" style="color:#555;font-weight:500">${fmtBs(valUSD)}</td>
           <td class="r" style="color:#555;font-weight:500">${fmtEur(valUSD)}</td>`
        : '';

      return `<tr>
        <td style="font-family:monospace;font-size:12px;color:#444">${sku}</td>
        <td>${pName}${bName}${vName}${catSubTag}</td>
        ${stockCell}
        ${formattedPriceCell}
        ${bsEurCells}
      </tr>`;
    }).join('');

    totalUnits += groupUnits;
    totalValueUSD += groupValueUSD;

    htmlCategories += `
      <div class="cat-section">
        <div class="cat-header">
          <span>${escapeHTML(meta.title)}</span>
          <!-- Unidades y valor del inventario son datos internos: al cliente
               solo se le dice cuántos artículos hay en la categoría. -->
          <span style="font-weight:normal;font-size:12px">${isCostMode
            ? `${items.length} ítems · ${groupUnits} u. · ${fmtPrice(groupValueUSD)}`
            : `${items.length} artículo${items.length === 1 ? '' : 's'}`}</span>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width:120px">SKU</th>
              <th>Producto / Marca</th>
              ${STOCK_MODE === 'oculta' ? '' : `<th class="c" style="width:${STOCK_MODE === 'pedido' ? 82 : 70}px">${STOCK_MODE === 'pedido' ? 'Entrega' : 'Existencia'}</th>`}
              <th class="r" style="width:90px">${priceLabel}</th>
              ${isCostMode ? '<th class="r" style="width:100px">En Bs (BCV)</th><th class="r" style="width:90px">En €</th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      </div>`;
  });

  // Fecha Y hora de la última lectura de la base: así se sabe si la lista es del
  // día o quedó vieja (el botón 🔄 Actualizar la regenera sin recargar la página).
  const gen = GENERADA_EN || new Date();
  const nowStr = gen.toLocaleDateString('es-VE', { year:'numeric', month:'long', day:'numeric' });
  const horaStr = gen.toLocaleTimeString('es-VE', { hour:'2-digit', minute:'2-digit' });

  const sheetClass = PAGE_BREAK_MODE === 'hojas' ? 'sheet page-break-sections' : 'sheet';

  document.getElementById('content').innerHTML = `
  <div class="${sheetClass}">
    <div class="cmp-head">
      <div class="cmp-biz">
        <img src="${escapeHTML(logoUrl)}" alt="">
        <div>
          <h1>${escapeHTML(bizName)}</h1>
          <div class="meta">
            ${s.rif ? 'RIF: ' + escapeHTML(s.rif) + '<br>' : ''}
            ${s.address ? escapeHTML(s.address) + '<br>' : ''}
          </div>
        </div>
      </div>
      <div class="cmp-doc">
        <span class="tag">${docTag}</span>
        <div class="date">${nowStr} · ${horaStr}</div>
        <div style="font-size:11px;color:#666;margin-top:2px">${isCostMode
          ? `${totalItems} artículos · ${totalUnits} unidades`
          : `${totalItems} artículos · precios vigentes al ${nowStr}`}</div>
      </div>
    </div>

    ${isCostMode ? `
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <div style="flex:1;min-width:150px;background:#f0f4f2;border-radius:6px;padding:8px 12px">
        <div style="font-size:10px;color:#666;text-transform:uppercase">Valor inventario (costo)</div>
        <div style="font-size:16px;font-weight:700;color:var(--doc-c)">${fmtPrice(totalValueUSD)}</div>
      </div>
      <div style="flex:1;min-width:150px;background:#f0f4f2;border-radius:6px;padding:8px 12px">
        <div style="font-size:10px;color:#666;text-transform:uppercase">En Bolívares (BCV)</div>
        <div style="font-size:16px;font-weight:700;color:var(--doc-c)">${fmtBs(totalValueUSD)}</div>
      </div>
      <div style="flex:1;min-width:150px;background:#f0f4f2;border-radius:6px;padding:8px 12px">
        <div style="font-size:10px;color:#666;text-transform:uppercase">En Euros</div>
        <div style="font-size:16px;font-weight:700;color:var(--doc-c)">${fmtEur(totalValueUSD)}</div>
      </div>
    </div>` : ''}

    ${htmlCategories || '<div class="err">No hay productos disponibles.</div>'}

    <div class="cmp-foot">
      ${isCostMode ? 'Documento interno confidencial — Lista de costos y existencias' : 'Lista oficial de precios'} (${bizName})
      ${(!isCostMode && STOCK_MODE === 'pedido')
        ? '<br><strong>A pedido</strong> = lo encargamos a nuestro proveedor y se lo confirmamos con la fecha de entrega. Consúltenos disponibilidad.'
        : ''}
      ${bcv ? `<br>Tasas de conversión: BCV Bs ${bcv.toFixed(2)}/USD${eurRate ? ` · Euro BCV Bs ${eurRate.toFixed(2)}/€` : ''}` : ''}
      ${!isCostMode ? '<br>Precios sujetos a cambio sin previo aviso según la tasa del día y la disponibilidad.' : ''}
    </div>
  </div>`;
}
</script>
</body>
</html>
