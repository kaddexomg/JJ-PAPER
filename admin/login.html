<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | JJ Paper</title>
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  .login-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--gr,#8a8a8a);font-size:12px}
  .login-or::before,.login-or::after{content:"";flex:1;height:1px;background:rgba(0,0,0,.12)}
  #googleBtn{align-items:center}
</style>
<link rel="stylesheet" href="../assets/css/perf.css">
<script src="../assets/js/perf.js"></script>
</head>
<body class="admin-body">

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <img class="n-logo-img" src="../assets/img/logo.svg" alt="JJ Paper" width="38" height="38">
      <span>JJ <em>Paper</em></span>
    </div>
    <h2>Acceso al panel</h2>
    <p>Administradores y vendedores. Te llevamos a tu panel según tu cuenta.</p>
    <div class="login-err" id="loginErr"></div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="fg" style="margin-bottom:14px">
        <label class="fl">Correo electronico</label>
        <input type="email" class="fi" id="loginEmail" placeholder="admin@jjpaper.com.ve" required autocomplete="email">
      </div>
      <div class="fg" style="margin-bottom:22px">
        <label class="fl">Contrasena</label>
        <input type="password" class="fi" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-p" style="width:100%;justify-content:center" id="loginBtn">
        Iniciar sesion
      </button>
    </form>
    <div class="login-or"><span>o</span></div>
    <button type="button" class="btn-o" style="width:100%;justify-content:center;gap:10px" id="googleBtn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuar con Google
    </button>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--gr)">
      <a href="../index.html" style="color:var(--gm)">← Volver al sitio</a>
    </p>
  </div>
</div>
<div class="toast-c" id="toastC"></div>

<script src="../assets/vendor/supabase-2.58.0.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/admin/auth.js"></script>
<script src="../assets/js/admin/sidenav.js?v=20260819b"></script>
<script>
// Si ya hay sesión activa (incluye el regreso del login con Google), va a su
// panel según el rol; si la cuenta aún no está activa, lo avisa y cierra sesión.
// Enruta según el perfil: activo → su panel; inactivo → aviso + cierre de sesión.
let _routing = false;
async function routeIfSession() {
  if (_routing) return;
  _routing = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { _routing = false; return; }
    CURRENT_PROFILE = null;                 // no confiar en caché de un intento previo
    const p = await loadProfile();
    if (p && p.active) { window.location.href = roleHome(p); return; }
    await sb.auth.signOut();
    const err = document.getElementById('loginErr');
    if (err) {
      err.textContent = p
        ? 'Tu cuenta con Google fue creada ✅ pero un administrador debe activarla antes de entrar.'
        : 'No se pudo cargar tu perfil. Intenta de nuevo.';
      err.classList.add('sh');
    }
  } finally { _routing = false; }
}

// Al volver de Google el token llega en el #hash; supabase-js lo procesa async.
// Escuchamos el evento para enrutar en cuanto la sesión quede lista (sin carrera).
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') routeIfSession();
});
routeIfSession();   // sesión ya existente (entrar de nuevo sin re-loguear)

// Login con Google (OAuth). El provider se habilita en el dashboard de Supabase.
async function loginWithGoogle() {
  const btn = document.getElementById('googleBtn');
  if (btn) { btn.disabled = true; btn.style.opacity = .6; }
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: siteURL('admin/login.html') }
  });
  if (error) {
    if (btn) { btn.disabled = false; btn.style.opacity = 1; }
    const err = document.getElementById('loginErr');
    if (err) {
      err.textContent = 'No se pudo abrir Google. ¿El administrador ya habilitó el acceso con Google?';
      err.classList.add('sh');
    }
  }
}

async function doLogin(e) {
  e.preventDefault();
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');
  const email = document.getElementById('loginEmail').value;
  const pass  = document.getElementById('loginPass').value;

  btn.disabled    = true;
  btn.textContent = 'Ingresando...';
  err.classList.remove('sh');

  try {
    await adminLogin(email, pass);
    const p = await loadProfile();
    if (!p || !p.active) {
      await sb.auth.signOut();
      throw new Error('inactive');
    }
    // La ruta de inicio depende del rol de la credencial usada
    btn.textContent = p.role === 'admin'
      ? 'Entrando al panel de administración…'
      : `Bienvenido ${p.name || ''}, abriendo tu panel de ventas…`;
    window.location.href = roleHome(p);
  } catch (ex) {
    const raw = (ex.message || '').toLowerCase();
    err.textContent =
      ex.message === 'inactive'      ? 'Tu cuenta aún no está habilitada. Un administrador debe activarla.'
    : raw.includes('not confirmed')  ? 'Tu cuenta aún no está habilitada. Un administrador debe activarla.'
    : raw.includes('invalid')        ? 'Credenciales incorrectas. Verifica tu correo y contraseña.'
    :                                  'No se pudo iniciar sesión. Intenta de nuevo en un momento.';
    err.classList.add('sh');
    btn.disabled    = false;
    btn.textContent = 'Iniciar sesion';
  }
}
</script>
</body>
</html>
