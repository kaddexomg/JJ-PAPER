<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJ Paper — Demo Logo 3D interactivo</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/logo3d.css">
<style>
  body{
    min-height:100vh;margin:0;
    background:linear-gradient(135deg,#16604A 0%,#003333 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;color:#fff;text-align:center;padding:24px;
    font-family:'Montserrat',sans-serif;
  }
  h1{font-size:clamp(22px,4vw,34px);font-weight:800;margin:0}
  h1 em{color:#99CC33;font-style:normal}
  p{color:rgba(255,255,255,.7);font-size:13px;max-width:420px;line-height:1.7}
  .stage{width:min(70vw,460px);margin:10px 0 6px}
  code{background:rgba(255,255,255,.12);padding:2px 7px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
  <h1>Logo <em>JJ Paper</em> 3D</h1>

  <!-- Punto de montaje: el script lo detecta por data-jj-logo3d -->
  <div class="stage" data-jj-logo3d></div>

  <p>Mové el mouse para dirigir la cámara y el giro.
     Hacé <strong>click</strong> sobre la moneda para el estallido.</p>
  <p>Insertá en tu web con <code>&lt;div data-jj-logo3d&gt;&lt;/div&gt;</code>
     + <code>logo3d.css</code> + <code>logo3d.js</code>.</p>

  <script src="assets/js/logo3d.js"></script>
</body>
</html>
