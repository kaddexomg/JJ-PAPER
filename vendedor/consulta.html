<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de existencias | JJ Paper Vendedor</title>
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/catalog.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/glass.css">
<link rel="stylesheet" href="../assets/css/print.css">
<style>
  .pf-ok{color:#2ecc40;font-weight:600}
  .pf-low{color:#e67e22;font-weight:600}
  .pf-out{color:#dc3c3c;font-weight:600}
  .cons-wrap{max-width:900px}
  .cons-card{background:var(--card,#fff);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:14px;margin-bottom:12px}
  .cons-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .cons-table{width:100%;font-size:13px}
  .cons-table th{font-size:11px;color:var(--gr,#888)}
  .cons-table td,.cons-table th{padding:6px 8px;text-align:left}
  @media(max-width:600px){ .cons-head{flex-wrap:wrap} }
</style>
</head>
<body class="admin-body">

<div class="admin-wrap">
  <aside class="admin-aside" id="adminAside">
    <div class="aside-brand">
      <img class="n-logo-img" src="../assets/img/logo.svg" alt="JJ Paper" width="38" height="38">
      <span>JJ <em>Paper</em></span>
    </div>
    <nav class="aside-nav">
      <span class="a-section">Ventas</span>
      <a href="index.html"><span class="a-ico">📊</span> Mi Panel</a>
      <a href="pos.html"><span class="a-ico">🛍️</span> Nueva venta (POS)</a>
      <a href="cotizador.html"><span class="a-ico">📋</span> Cotizador</a>
      <a href="consulta.html" class="on"><span class="a-ico">🔎</span> Consultar stock</a>
      <a href="pedidos.html"><span class="a-ico">🛒</span> Mis pedidos</a>
      <a href="clientes.html"><span class="a-ico">👥</span> Mis clientes</a>
      <a href="whatsapp.html"><span class="a-ico">💬</span> WhatsApp</a>
      <a href="correo.html"><span class="a-ico">📧</span> Correo</a>
      <a href="difusion.html"><span class="a-ico">📣</span> Difusión</a>
      <div class="divider"></div>
      <span class="a-section">Sitio</span>
      <a href="../catalogo.html" target="_blank"><span class="a-ico">🌐</span> Ver catálogo</a>
      <a href="#" onclick="adminLogout()"><span class="a-ico">🚪</span> Cerrar Sesion</a>
    </nav>
    <div class="aside-ft">Sesion: <strong id="adminUserEmail" style="color:#fff">—</strong></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggleBtn">☰</button>
        <div class="topbar-title">
          <h2>🔎 Consultar existencias</h2>
          <p>Busca un producto y mira su stock y precio al instante</p>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <div class="cons-wrap">
        <div style="display:flex;gap:8px;margin-bottom:14px">
          <input class="fi" id="consSearch" placeholder="Nombre, código de barras, SKU o marca…" oninput="consSearch()" onkeydown="consKey(event)" autocomplete="off" style="flex:1">
          <button class="btn-o" onclick="consScan()" title="Escanear con la cámara" aria-label="Escanear">📷</button>
        </div>
        <div id="consResults"><div class="wa-empty">Cargando catálogo…</div></div>
      </div>
    </div>
  </main>
</div>

<div class="toast-c" id="toastC"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/admin/auth.js"></script>
<script src="../assets/js/admin/sidenav.js"></script>
<script src="../assets/js/vendedor/vcommon.js"></script>
<script src="../assets/js/vendedor/product-finder.js"></script>
<script src="../assets/js/vendedor/consulta.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const seller = await initSellerPage();
  if (!seller) return;
  await initConsulta();
});
</script>
</body>
</html>
