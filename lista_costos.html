<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Costos | JJ Paper</title>
<link rel="icon" href="assets/img/logo.svg">
<style>
  :root { --doc-c:#16604A; --doc-a:#C9A24B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#1a1a1a; background:#eef1f0; padding:15px; }
  .sheet { max-width:900px; margin:0 auto; background:#fff; padding:24px 30px; border-radius:8px;
    box-shadow:0 4px 24px rgba(0,0,0,.1); }
  .cmp-head { display:flex; justify-content:space-between; align-items:flex-start; gap:15px;
    border-bottom:2px solid var(--doc-c); padding-bottom:12px; margin-bottom:12px; }
  .cmp-biz { display:flex; gap:10px; align-items:center; }
  .cmp-biz img { width:48px; height:48px; object-fit:contain; }
  .cmp-biz h1 { font-size:18px; color:var(--doc-c); line-height:1.1; }
  .cmp-biz .meta { font-size:11px; color:#555; margin-top:2px; }
  .cmp-doc { text-align:right; }
  .cmp-doc .tag { display:inline-block; background:var(--doc-c); color:#fff; font-weight:700;
    font-size:11px; padding:3px 8px; border-radius:4px; letter-spacing:.5px; }
  .cmp-doc .date { font-size:11px; color:#555; margin-top:4px; }

  .cat-section { margin-top:10px; margin-bottom:4px; break-inside:auto; page-break-inside:auto; }
  .cat-header { background:var(--doc-c); color:#fff; font-size:12px; font-weight:700; padding:4px 8px; border-radius:3px; margin-bottom:3px; display:flex; justify-content:space-between; align-items:center; break-after:avoid; page-break-after:avoid; }
  
  table { width:100%; border-collapse:collapse; margin-bottom:4px; break-inside:auto; page-break-inside:auto; }
  thead th { background:#f0f4f2; color:var(--doc-c); font-size:10.5px; text-align:left; padding:3px 6px; border-bottom:1.5px solid var(--doc-c); }
  thead th.r { text-align:right; } thead th.c { text-align:center; }
  tbody tr { break-inside:avoid; page-break-inside:avoid; }
  tbody td { padding:3px 6px; border-bottom:1px solid #eef2f0; font-size:11px; line-height:1.25; }
  tbody td.r { text-align:right; font-weight:600; } tbody td.c { text-align:center; }
  tbody tr:nth-child(even) { background:#fbfdfc; }

  .cmp-foot { margin-top:16px; border-top:1px solid #e5e9e7; padding-top:10px; font-size:10.5px; color:#777; text-align:center; }
  .toolbar { max-width:900px; margin:0 auto 12px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .btn { border:0; border-radius:6px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn-p { background:var(--doc-c); color:#fff; }
  .btn-g { background:#dfe5e2; color:var(--doc-c); }
  .loading, .err { max-width:900px; margin:30px auto; text-align:center; color:#555; }
  .err { color:#b00; }

  @media print {
    /* Conserva los fondos de color: sin esto los encabezados verdes con
       texto blanco salen blanco-sobre-blanco (invisibles) al imprimir. */
    body { background:#fff; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sheet { box-shadow:none; border-radius:0; max-width:none; padding:10px 15px; }
    .toolbar { display:none; }
    /* Repite la cabecera de columnas en cada página de listas largas */
    thead { display:table-header-group; }
    tr { page-break-inside:avoid; }
    @page { margin:8mm 10mm; }
  }
</style>
</head>
<body>
<div class="toolbar" id="toolbar" style="display:none">
  <input type="search" placeholder="Buscar producto, marca o SKU…" oninput="onSearchCost(this.value)"
    style="flex:1 1 220px;min-width:180px;border:1px solid #cdd6d2;border-radius:6px;padding:8px 12px;font-size:13px">
  <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--doc-c);font-weight:600;cursor:pointer">
    <input type="checkbox" onchange="onToggleZero(this)"> Ocultar agotados
  </label>
  <button class="btn btn-p" onclick="window.print()">🖨️ Imprimir Lista</button>
  <button class="btn btn-g" onclick="window.close()">Cerrar</button>
</div>

<div id="content"><div class="loading">Cargando lista de costos…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin/auth.js"></script>
<script>
(async () => {
  const content = document.getElementById('content');
  // La lista de COSTOS (?mode=cost) es confidencial: solo admin. La lista de
  // PRECIOS al público la puede abrir cualquier vendedor.
  const needAdmin = new URLSearchParams(location.search).get('mode') === 'cost';
  const session = await requireAuth(needAdmin ? 'admin' : 'vendedor');
  if (!session) return;
  await loadSettings();
  applyDocTheme();

  // Obtener variantes de productos con sus categorías (cost_usd, price_usd y stock)
  const select = 'id,sku,cost_usd,price_usd,stock,variant_name,jjp_brands(name),'
    + 'jjp_products(name,jjp_categories(name,sort_order))';
  
  let out = [], CHUNK = 1000;
  for (let from = 0; ; from += CHUNK) {
    const { data, error } = await sb.from('jjp_product_variants')
      .select(select)
      .eq('active', true)
      .range(from, from + CHUNK - 1);
      
    if (error) { 
      content.innerHTML = '<div class="err">Error al obtener lista de productos/costos.</div>'; 
      console.error(error); 
      return; 
    }
    out.push(...(data || []));
    if (!data || data.length < CHUNK) break;
  }

  ALL_VARIANTS = out;
  renderList(out);
  document.getElementById('toolbar').style.display = 'flex';
})();

// Estado de filtros (barra de herramientas, no se imprime)
let ALL_VARIANTS = [];
let FILTER_HIDE_ZERO = false;
let FILTER_SEARCH = '';

function applyFilters() {
  let rows = ALL_VARIANTS;
  if (FILTER_HIDE_ZERO) rows = rows.filter(v => (v.stock || 0) > 0);
  const q = (FILTER_SEARCH || '').trim().toLowerCase();
  if (q) rows = rows.filter(v => {
    const hay = [(v.jjp_products?.name), v.jjp_brands?.name, v.variant_name, v.sku]
      .filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q);
  });
  renderList(rows);
}
function onToggleZero(el) { FILTER_HIDE_ZERO = el.checked; applyFilters(); }
function onSearchCost(v) { FILTER_SEARCH = v; applyFilters(); }

function applyDocTheme() {
  const s = APP.SETTINGS || {};
  const okColor = c => /^#[0-9a-fA-F]{3,8}$/.test((c || '').trim());
  if (okColor(s.doc_color))  document.documentElement.style.setProperty('--doc-c', s.doc_color.trim());
  if (okColor(s.doc_accent)) document.documentElement.style.setProperty('--doc-a', s.doc_accent.trim());
}

function renderList(variants) {
  const s = APP.SETTINGS || {};
  const bizName  = s.business_name || s.site_name || 'JJ Paper';
  const logoUrl  = s.doc_logo_url || 'assets/img/logo.svg';

  // Permite verificar si la URL solicita modo costo (?mode=cost) o por defecto precio público
  const params = new URLSearchParams(location.search);
  const isCostMode = params.get('mode') === 'cost';
  const priceLabel = isCostMode ? 'Costo (USD)' : 'Precio (USD)';
  const docTitle   = isCostMode ? 'LISTA DE COSTOS' : 'LISTA DE PRECIOS';

  // Tasas para conversión: BCV (Bs/USD) y euro BCV (Bs/EUR)
  const bcv = getBcvRate();
  const eurRate = getEurRate();
  const toBs  = usd => bcv ? usd * bcv : null;
  const toEur = usd => (bcv && eurRate) ? usd * bcv / eurRate : null;
  const fmtBs  = usd => { const v = toBs(usd);  return v == null ? '—' : 'Bs ' + v.toLocaleString('es-VE', { maximumFractionDigits: 2 }); };
  const fmtEur = usd => { const v = toEur(usd); return v == null ? '—' : '€ ' + v.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };

  // Agrupar por categoría
  const groups = {};
  variants.forEach(v => {
    const catName = v.jjp_products?.jjp_categories?.name || 'Sin Categoría';
    if (!groups[catName]) groups[catName] = [];
    groups[catName].push(v);
  });

  // Ordenar categorías alfabéticamente
  const sortedCats = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'es'));

  let htmlCategories = '';
  let totalItems = 0, totalUnits = 0, totalValueUSD = 0;

  sortedCats.forEach(cat => {
    const items = groups[cat];
    // Ordenar productos dentro de la categoría por nombre de producto
    items.sort((a, b) => {
      const nameA = (a.jjp_products?.name || '') + ' ' + (a.jjp_brands?.name || '') + ' ' + (a.variant_name || '');
      const nameB = (b.jjp_products?.name || '') + ' ' + (b.jjp_brands?.name || '') + ' ' + (b.variant_name || '');
      return nameA.localeCompare(nameB, 'es');
    });

    totalItems += items.length;
    let catUnits = 0, catValueUSD = 0;

    const rowsHtml = items.map(i => {
      const pName = escapeHTML(i.jjp_products?.name || '—');
      const bName = i.jjp_brands?.name ? ` <small style="color:#666">(${escapeHTML(i.jjp_brands.name)})</small>` : '';
      const vName = (i.variant_name && i.variant_name !== 'Única' && i.variant_name !== 'Estándar') ? ` <small style="color:#555">· ${escapeHTML(i.variant_name)}</small>` : '';
      const sku = escapeHTML(i.sku || '—');
      const valUSD = isCostMode ? (i.cost_usd || 0) : (i.price_usd || 0);
      const stock = Number(i.stock) || 0;
      catUnits += stock;
      catValueUSD += valUSD * stock;

      // Existencia con semáforo: rojo agotado, ámbar bajo (≤5), verde ok
      const stockColor = stock <= 0 ? '#b00' : (stock <= 5 ? '#c08a00' : '#0a7');
      const stockTxt = stock <= 0 ? 'Agotado' : String(stock);

      // Bs y € solo en modo costo (interno). La lista de precios pública = solo USD.
      const bsEurCells = isCostMode
        ? `<td class="r" style="color:#555;font-weight:500">${fmtBs(valUSD)}</td>
           <td class="r" style="color:#555;font-weight:500">${fmtEur(valUSD)}</td>`
        : '';

      return `<tr>
        <td style="font-family:monospace;font-size:12px;color:#444">${sku}</td>
        <td>${pName}${bName}${vName}</td>
        <td class="c" style="color:${stockColor};font-weight:700">${stockTxt}</td>
        <td class="r">${fmtPrice(valUSD)}</td>
        ${bsEurCells}
      </tr>`;
    }).join('');

    totalUnits += catUnits;
    totalValueUSD += catValueUSD;

    htmlCategories += `
      <div class="cat-section">
        <div class="cat-header">
          <span>📂 ${escapeHTML(cat)}</span>
          <span style="font-weight:normal;font-size:12px">${items.length} ítems · ${catUnits} u. · ${fmtPrice(catValueUSD)}</span>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width:120px">SKU</th>
              <th>Producto / Marca</th>
              <th class="c" style="width:70px">Existencia</th>
              <th class="r" style="width:90px">${priceLabel}</th>
              ${isCostMode ? '<th class="r" style="width:100px">En Bs (BCV)</th><th class="r" style="width:90px">En €</th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      </div>`;
  });

  const nowStr = new Date().toLocaleDateString('es-VE', { year:'numeric', month:'long', day:'numeric' });

  document.getElementById('content').innerHTML = `
  <div class="sheet">
    <div class="cmp-head">
      <div class="cmp-biz">
        <img src="${escapeHTML(logoUrl)}" alt="">
        <div>
          <h1>${escapeHTML(bizName)}</h1>
          <div class="meta">
            ${s.rif ? 'RIF: ' + escapeHTML(s.rif) + '<br>' : ''}
            ${s.address ? escapeHTML(s.address) + '<br>' : ''}
          </div>
        </div>
      </div>
      <div class="cmp-doc">
        <span class="tag">${docTitle}</span>
        <div class="date">${nowStr}</div>
        <div style="font-size:11px;color:#666;margin-top:2px">${totalItems} artículos · ${totalUnits} unidades</div>
      </div>
    </div>

    ${isCostMode ? `
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <div style="flex:1;min-width:150px;background:#f0f4f2;border-radius:6px;padding:8px 12px">
        <div style="font-size:10px;color:#666;text-transform:uppercase">Valor inventario (costo)</div>
        <div style="font-size:16px;font-weight:700;color:var(--doc-c)">${fmtPrice(totalValueUSD)}</div>
      </div>
      <div style="flex:1;min-width:150px;background:#f0f4f2;border-radius:6px;padding:8px 12px">
        <div style="font-size:10px;color:#666;text-transform:uppercase">En Bolívares (BCV)</div>
        <div style="font-size:16px;font-weight:700;color:var(--doc-c)">${fmtBs(totalValueUSD)}</div>
      </div>
      <div style="flex:1;min-width:150px;background:#f0f4f2;border-radius:6px;padding:8px 12px">
        <div style="font-size:10px;color:#666;text-transform:uppercase">En Euros</div>
        <div style="font-size:16px;font-weight:700;color:var(--doc-c)">${fmtEur(totalValueUSD)}</div>
      </div>
    </div>` : ''}

    ${htmlCategories || '<div class="err">No hay productos disponibles.</div>'}

    <div class="cmp-foot">
      ${isCostMode ? 'Documento interno confidencial — Lista de costos y existencias' : 'Lista de precios en Divisas (USD)'} por categoría (${bizName})
      ${bcv ? `<br>Tasas de conversión: BCV Bs ${bcv.toFixed(2)}/USD${eurRate ? ` · Euro BCV Bs ${eurRate.toFixed(2)}/€` : ''}` : ''}
    </div>
  </div>`;
}
</script>
</body>
</html>
