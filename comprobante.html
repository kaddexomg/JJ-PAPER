<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobante | JJ Paper</title>
<link rel="icon" href="assets/img/logo.svg">
<style>
  /* Colores B/N para alta definición en impresión láser */
  :root { 
    --doc-c: #000000; 
    --doc-a: #222222; 
    --line: #000000;
    --border: #444444;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color:#000; background:#f4f4f4; padding:20px; }
  
  /* Contenedor principal de la página con marco grueso B/N */
  .sheet { 
    max-width:820px; margin:0 auto; background:#fff; padding:38px 42px; 
    border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,0.15); 
    border: 1px solid #ddd;
  }

  /* ==========================================================
     CABECERA - PRESENTACIÓN FORMAL B/N (FACTURA)
     ========================================================== */
  .fisc-head { 
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    border-bottom:3px solid var(--line); padding-bottom:16px; margin-bottom:18px; 
  }
  .fisc-biz { display:flex; gap:16px; align-items:flex-start; flex:1; min-width:0; }
  
  /* Imagen del logo reajustada para alto contraste o grises */
  .fisc-biz img { 
    width:70px; height:70px; object-fit:contain; flex-shrink:0; 
    filter: grayscale(100%) contrast(120%);
  }
  
  .fisc-biz .razon { 
    font-size:22px; font-weight:900; color:#000; line-height:1.1;
    text-transform:uppercase; letter-spacing:0.5px; 
  }
  .fisc-biz .rif { 
    font-size:14px; font-weight:700; color:#000; margin-top:4px; letter-spacing:0.5px; 
  }
  .fisc-biz .dir { 
    font-size:12px; color:#111; line-height:1.6; margin-top:6px; 
  }
  .fisc-biz .dir .et { color:#555; font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:0.5px; }

  /* Recuadro de Documento: Nítido con bordes gruesos */
  .fisc-doc { 
    border:2.5px solid var(--line); border-radius:6px; min-width:260px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
  }
  .fisc-doc .tipo { 
    background:var(--line); color:#fff; text-align:center; font-weight:900;
    font-size:15px; letter-spacing:3px; padding:8px 12px; text-transform: uppercase;
  }
  .fisc-doc .fila { 
    display:flex; justify-content:space-between; gap:12px; padding:6px 12px;
    font-size:13px; border-bottom:1px solid #ccc; background:#fff;
  }
  .fisc-doc .fila:last-child { border-bottom:0; }
  .fisc-doc .fila .et { color:#333; font-weight: 600; }
  .fisc-doc .fila .vl { font-weight:800; color:#000; }
  
  .fisc-doc .control { border-top: 1.5px solid #000; background: #fdfdfd; }
  .fisc-doc .control .et { font-weight: 900; }
  .fisc-doc .control .vl { font-size:14.5px; letter-spacing:1px; }

  /* Datos del Cliente: Caja clara, alto contraste */
  .fisc-cli { 
    border:1.5px solid var(--border); border-radius:6px; margin:16px 0; overflow:hidden; 
  }
  .fisc-cli .cab { 
    background:#e5e5e5; border-bottom: 1.5px solid var(--border); 
    color:#000; font-size:12px; font-weight:800;
    letter-spacing:1.5px; padding:6px 14px; text-transform:uppercase; 
  }
  .fisc-cli .cuerpo { 
    display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; padding:12px 14px; background:#fafafa;
  }
  .fisc-cli .campo { font-size:13px; line-height:1.6; display:flex; gap:8px; min-width:0; }
  .fisc-cli .campo .et { color:#444; flex-shrink:0; font-weight: 600; }
  .fisc-cli .campo .vl { font-weight:700; color:#000; overflow-wrap:anywhere; }
  .fisc-cli .campo.full { grid-column:1 / -1; }

  /* ==========================================================
     TABLA DE PRODUCTOS
     ========================================================== */
  table { 
    width:100%; border-collapse:collapse; margin-top:12px; border: 1.5px solid var(--border);
  }
  thead th { 
    background:#e5e5e5; color:#000; font-size:12px; font-weight:800; text-transform:uppercase;
    text-align:left; padding:10px 12px; border-bottom: 2px solid var(--line); border-right: 1px solid #ccc;
  }
  thead th:last-child { border-right: none; }
  thead th.r { text-align:right; } thead th.c { text-align:center; }
  
  tbody td { 
    padding:8px 12px; border-bottom:1px solid #ddd; border-right: 1px solid #eee; 
    font-size:13.5px; color:#000; 
  }
  tbody td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: 2px solid var(--border); }
  tbody td.r { text-align:right; } tbody td.c { text-align:center; }

  /* ==========================================================
     TOTALES
     ========================================================== */
  .fisc-tot { display:flex; justify-content:flex-end; margin-top:16px; }
  .fisc-tot table { 
    width:auto; min-width:340px; margin:0; border: 2px solid var(--line); 
  }
  .fisc-tot td { padding:6px 12px; font-size:14px; border:0; border-bottom: 1px solid #ccc; }
  .fisc-tot td.et { text-align:right; color:#333; font-weight: 600; background: #fafafa; border-right: 1px solid #ccc; }
  .fisc-tot td.vl { text-align:right; font-weight:800; min-width:140px; background: #fff; }
  
  .fisc-tot tr.grand td { 
    font-size:18px; color:#000; background:#e5e5e5; font-weight:900;
    padding:10px 12px; border-bottom: 2px solid var(--line); border-top: 2px solid var(--line);
  }
  .fisc-tot tr.grand td.et { border-right: 1px solid #ccc; }
  .fisc-tot tr.bs td { color:#000; font-weight:800; font-size: 15px; }
  .fisc-tot tr.tasa td { font-size:12px; color:#444; font-weight:500; }
  .fisc-tot tr:last-child td { border-bottom: none; }

  /* ==========================================================
     AVISOS Y FIRMAS
     ========================================================== */
  .fisc-aviso { 
    margin-top:20px; border:2px dashed #777; background:#fff; border-radius:8px;
    padding:10px 14px; font-size:11px; color:#000; line-height:1.6; text-align: center;
  }
  .fisc-aviso strong { color:#000; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
  
  .cmp-foot { 
    margin-top:24px; border-top:2px solid var(--border); padding-top:16px; 
    font-size:12px; color:#333; line-height:1.6; 
  }
  
  .sign-area { display:flex; gap:24px; margin-top:30px; align-items:flex-end; }
  .sign-area .sign-box { flex:1; padding-top:34px; font-size:12px; color:#000; font-weight: 600; text-align: center; }
  .sign-area .sign-box .ln { display:block; border-top:1.5px solid #000; padding-top:6px; text-transform: uppercase; letter-spacing: 0.5px;}
  .sign-area .sello { 
    width:160px; height:80px; border:2px dashed #999; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#777;
    letter-spacing:1.5px; text-transform:uppercase; flex-shrink:0; font-weight: 700; 
  }

  /* ---- Varias hojas en un solo documento ---- */
  .sheet + .sheet { margin-top:24px; }
  .sheet { position:relative; }
  .cut-note { 
    max-width:820px; margin:14px auto -8px; text-align:center; font-size:12px;
    color:#555; letter-spacing:2px; text-transform: uppercase; font-weight: 700;
  }
  
  /* Marca de agua ANULADO */
  .voidmark { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:50; }
  .voidmark span { 
    font-size:110px; font-weight:900; color:rgba(0,0,0,.15); border:10px solid rgba(0,0,0,.15);
    border-radius:20px; padding:4px 40px; transform:rotate(-20deg); letter-spacing:12px; text-transform:uppercase; 
  }

  /* ---- Ocultar UI al imprimir y forzar fondos B/N ---- */
  @media print { 
    .cut-note { display:none } 
    body { background: none; padding: 0; }
    .sheet { box-shadow: none; border: none; padding: 0; max-width: none; }
    .toolbar { display: none !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }

  .toolbar { max-width:820px; margin:0 auto 16px; display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; }
  .btn { border:1px solid #ccc; border-radius:6px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn-p { background:#000; color:#fff; border-color: #000; }
  .btn-g { background:#fff; color:#000; }
  .loading, .err { max-width:820px; margin:40px auto; text-align:center; color:#333; font-weight: 600; font-size: 15px; }
  .err { color:#000; }

  /* ---- Formato ticket ---- */
  body.ticket { background:#fff; padding:8px; }
  body.ticket .sheet { max-width:340px; padding:14px 12px; border:2px dashed #000; border-radius:0; font-size:13px; }
  body.ticket .sign-area { flex-direction:column; align-items:stretch; gap:20px; margin-top:24px; }
  body.ticket .sign-area .sello { width:100%; height:60px; border-color: #000; }
  body.ticket tfoot tr.total td { font-size:14px; }
  body.ticket .cmp-foot { margin-top:12px; padding-top:8px; font-size:10px; text-align:center; }
  /* Formato fiscal en rollo de 80mm: todo a una columna y centrado */
  body.ticket .fisc-head { flex-direction:column; align-items:center; text-align:center; gap:8px; }
  body.ticket .fisc-biz { flex-direction:column; align-items:center; text-align:center; gap:5px; }
  body.ticket .fisc-biz img { width:52px; height:52px; }
  body.ticket .fisc-biz .razon { font-size:16px; }
  body.ticket .fisc-biz .rif { font-size:12px; }
  body.ticket .fisc-biz .dir { font-size:10.5px; }
  body.ticket .fisc-doc { min-width:0; width:100%; border-width: 1.5px; }
  body.ticket .fisc-doc .tipo { font-size:13px; letter-spacing:1px; padding:6px; }
  body.ticket .fisc-doc .fila { font-size:11.5px; padding:4px 8px; }
  body.ticket .fisc-cli { border-width: 1px; }
  body.ticket .fisc-cli .cuerpo { grid-template-columns:1fr; padding:8px 10px; }
  body.ticket .fisc-cli .campo { font-size:11.5px; }
  body.ticket .fisc-tot { justify-content:stretch; }
  body.ticket .fisc-tot table { width:100%; min-width:0; border-width: 1.5px; }
  body.ticket .fisc-tot td { font-size:12px; padding:4px 6px; }
  body.ticket .fisc-tot tr.grand td { font-size:14px; padding:8px 6px; }
  body.ticket .fisc-aviso { font-size:10px; padding:8px; border-color: #000; }

  @media print {
    html, body { height:100%; }
    body { background:#fff; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    @page { margin: 0; } /* Forzar al navegador a no imprimir la url ni fecha */
    .sheet { padding-top: 15mm; padding-bottom: 15mm; } /* Padding manual para simular el margen */

    /* Cada documento ocupa UNA página completa y ni un milímetro más.
       Antes la hoja crecía libre y una factura con pocas líneas se comía
       parte de la siguiente: dos documentos salían en tres páginas.
       Con altura fija + columna flexible, el bloque de firmas queda
       anclado abajo y el salto cae donde debe. */
    .sheet {
      box-shadow:none; border-radius:0; max-width:none; margin:0;
      padding:4mm 5mm; min-height:100%;   /* la altura del papel, sea Carta o A4 */
      display:flex; flex-direction:column;
      break-after:page; page-break-after:always; break-inside:avoid;
    }
    .sheet:last-of-type { break-after:auto; page-break-after:auto; }

    /* El espacio sobrante se lo queda la tabla, no los márgenes */
    .sheet table { flex:0 0 auto; }
    .sheet .fisc-tot { margin-top:10px; }
    .sheet .sign-area { margin-top:auto; padding-top:14px; }
    .sheet .fisc-aviso { margin-top:10px; }
    .sheet .cmp-foot { margin-top:8px; padding-top:8px; }

    /* Compactado para papel: en pantalla el documento respira, pero impreso
       cada fila medía 57px y diez productos se comían media hoja. Con esto
       entran ~20 líneas y la factura sigue cerrando en una sola página. */
    .fisc-head { padding-bottom:7px; margin-bottom:7px; }
    .fisc-biz { gap:10px; }
    .fisc-biz img { width:42px; height:42px; }
    .fisc-biz .razon { font-size:14px; }
    .fisc-biz .rif { font-size:10.5px; margin-top:1px; }
    .fisc-biz .dir { font-size:9px; line-height:1.3; margin-top:2px; }
    .fisc-doc { min-width:200px; }
    .fisc-doc .tipo { font-size:11.5px; padding:3px 8px; letter-spacing:1.4px; }
    .fisc-doc .fila { font-size:9.5px; padding:2.5px 8px; }
    .fisc-doc .control .vl { font-size:11px; }

    .fisc-cli { margin:7px 0 2px; }
    .fisc-cli .cab { font-size:9px; padding:2.5px 10px; letter-spacing:1px; }
    .fisc-cli .cuerpo { padding:5px 10px; gap:0 14px; }
    .fisc-cli .campo { font-size:10px; line-height:1.35; }

    thead th { font-size:9px; padding:4px 8px; }
    tbody td { font-size:9.5px; padding:2.5px 8px; }

    .fisc-tot { margin-top:8px; }
    .fisc-tot td { font-size:10px; padding:2px 8px; }
    .fisc-tot tr.grand td { font-size:12.5px; padding:4px 8px; }
    .fisc-tot tr.tasa td { font-size:8.5px; }

    .sign-area { gap:14px; }
    .sign-area .sign-box { padding-top:16px; font-size:10px; }
    .sign-area .sello { width:124px; height:46px; font-size:8px; }
    .fisc-aviso { font-size:8px; padding:5px 9px; line-height:1.35; margin-top:8px; }
    .cmp-foot { font-size:8.5px; margin-top:6px; padding-top:6px; line-height:1.4; }

    /* !important: el JS pone display:flex inline al mostrar la barra; sin
       !important el estilo inline ganaría y la barra se imprimiría. */
    .toolbar { display:none !important; }

    body.ticket .sheet { border:0; max-width:none; padding:2mm; height:auto; display:block; overflow:visible; }
    body.ticket { padding:0; }
  }
</style>
<!-- Tamaño de página dinámico: en formato ticket usa rollo 80mm; en carta, hoja normal -->
<style id="pageStyle"></style>
</head>
<body>
<div class="toolbar" id="toolbar" style="display:none">
  <select class="btn btn-g" id="docSel" onchange="setDocType(this.value)" style="display:none">
    <option value="factura">📄 Factura</option>
    <option value="recibo">📦 Orden de recibo</option>
    <option value="comprobante">📃 Comprobante</option>
    <option value="ambos">📄+📦 Factura + Orden de recibo</option>
  </select>
  <button class="btn btn-g" id="fmtBtn" onclick="toggleFormat()">📃 Ver como ticket</button>
  <button class="btn btn-p" onclick="window.print()">🖨️ Imprimir</button>
  <button class="btn btn-g" onclick="window.close()">Cerrar</button>
</div>
<div id="content"><div class="loading">Cargando comprobante…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin/auth.js"></script>
<script>
let ORDER = null;
// factura | recibo | comprobante | presupuesto | ambos (= factura + orden de recibo)
let DOC_TYPE = 'comprobante';

// Los tipos que se dibujan, en orden. 'ambos' saca las dos hojas en una sola
// impresión: primero la factura, después la orden de recibo para firmar.
const DOC_TYPES = { ambos: ['factura', 'recibo'] };
function docTypeList(t) { return DOC_TYPES[t] || [t]; }

(async () => {
  const content = document.getElementById('content');
  const session = await requireAuth('vendedor');   // admin o vendedor
  if (!session) return;
  await loadSettings();
  applyDocTheme();

  const params = new URLSearchParams(location.search);
  const orderNum = params.get('n');
  const quoteNum = params.get('q');   // ?q=<quote_number> → imprime PRESUPUESTO
  const facNum   = params.get('fac'); // ?fac=<invoice_number> → busca por factura directamente
  if (!orderNum && !quoteNum && !facNum) { content.innerHTML = '<div class="err">Falta el número de documento (?n=..., ?q=... o ?fac=...)</div>'; return; }

  // Formato inicial: ?f=ticket|carta manda; si no, el ajuste doc_paper
  const s = APP.SETTINGS || {};
  const f = params.get('f') || s.doc_paper || 'carta';
  setFormat(f === 'ticket');

  let docData;
  if (quoteNum) {
    DOC_TYPE = 'presupuesto';
    const { data: q, error } = await sb.from('jjp_quotes').select('*').eq('quote_number', quoteNum).maybeSingle();
    if (error || !q) { content.innerHTML = '<div class="err">No se encontró la cotización ' + escapeHTML(quoteNum) + '.</div>'; return; }
    docData = normalizeQuote(q);
  } else {
    // ?t=factura|recibo|comprobante|ambos (por defecto comprobante).
    // 'factura+recibo' llega como 'factura recibo' (el + se decodifica a espacio).
    let t = (params.get('t') || (facNum ? 'factura' : 'comprobante')).toLowerCase().trim();
    if (/^factura[\s+,]+recibo$/.test(t)) t = 'ambos';
    DOC_TYPE = ['factura', 'recibo', 'comprobante', 'ambos'].includes(t) ? t : 'comprobante';

    let o = null;
    if (orderNum) {
      const res = await sb.from('jjp_orders').select('*').eq('order_number', orderNum).maybeSingle();
      o = res.data;
      if (!o) {
        // Si no se halló por pedido, buscar si orderNum corresponde al número de factura
        const facRes = await sb.from('jjp_orders').select('*').eq('invoice_number', orderNum).maybeSingle();
        if (facRes.data) { o = facRes.data; DOC_TYPE = 'factura'; }
      }
    } else if (facNum) {
      const facRes = await sb.from('jjp_orders').select('*').eq('invoice_number', facNum).maybeSingle();
      o = facRes.data;
      DOC_TYPE = 'factura';
    }

    if (!o) { content.innerHTML = '<div class="err">No se encontró el pedido o factura ' + escapeHTML(orderNum || facNum) + '.</div>'; return; }
    docData = o;
  }

  ORDER = docData;
  render(docData);
  document.getElementById('toolbar').style.display = 'flex';
  // El selector de tipo (Factura/Recibo/Comprobante) solo aplica a pedidos
  const ds = document.getElementById('docSel');
  if (ds && DOC_TYPE !== 'presupuesto') { ds.value = DOC_TYPE; ds.style.display = ''; }
  if (params.get('print') === '1') setTimeout(() => window.print(), 400);
})();

// Cambia el tipo de documento en vivo (mismo pedido → factura o recibo)
function setDocType(t) { DOC_TYPE = t; if (ORDER) render(ORDER); }

// Convierte una cotización (jjp_quotes) en un objeto con la MISMA forma que un
// pedido para reusar render(). Es solo para imprimir: no persiste nada.
function normalizeQuote(q) {
  const items = typeof q.items === 'string' ? JSON.parse(q.items) : (q.items || []);
  const subtotal = items.reduce((sum, i) => sum + Number(i.subtotal_usd ?? (Number(i.price_usd) || 0) * (Number(i.qty) || 0)), 0);
  const total = Number(q.estimated_total_usd) || subtotal;
  return {
    order_number: q.quote_number,
    client_name: q.client_name, rif: q.rif, phone: q.phone, email: q.email,
    city: q.city, address: q.address,
    items, subtotal_usd: subtotal, total_usd: total,
    discount_pct: q.discount_pct,
    discount_status: Number(q.discount_pct) > 0 ? 'approved' : 'none',
    exchange_rate: q.exchange_rate,
    payment_method: null, payment_ref: null,
    notes: q.notes, status: q.status, created_at: q.created_at,
  };
}

// Aplica colores/tema del documento configurados en Ajustes
function applyDocTheme() {
  const s = APP.SETTINGS || {};
  const okColor = c => /^#[0-9a-fA-F]{3,8}$/.test((c || '').trim());
  if (okColor(s.doc_color))  document.documentElement.style.setProperty('--doc-c', s.doc_color.trim());
  if (okColor(s.doc_accent)) document.documentElement.style.setProperty('--doc-a', s.doc_accent.trim());
}

function setFormat(ticket) {
  document.body.classList.toggle('ticket', ticket);
  const btn = document.getElementById('fmtBtn');
  if (btn) btn.textContent = ticket ? '📄 Ver como carta' : '📃 Ver como ticket';
  // En ticket, la hoja de impresión se ajusta al rollo térmico de 80mm
  const ps = document.getElementById('pageStyle');
  if (ps) ps.textContent = ticket ? '@media print{ @page{ size:80mm auto; margin:4mm 3mm } }' : '';
}
function toggleFormat() { setFormat(!document.body.classList.contains('ticket')); }

// Dibuja el documento: una hoja, o dos si el tipo es 'ambos'
function render(o) {
  const tipos = docTypeList(DOC_TYPE);
  document.getElementById('content').innerHTML = tipos
    .map((t, i) => (i ? '<div class="cut-note">— — — — —  hoja ' + (i + 1) + ' de ' + tipos.length + '  — — — — —</div>' : '') + sheet(o, t))
    .join('');
}

function sheet(o, docType) {
  const s = APP.SETTINGS || {};
  const isQuote = docType === 'presupuesto';
  const items = typeof o.items === 'string' ? JSON.parse(o.items) : (o.items || []);
  const rate = Number(o.exchange_rate) || getRate();
  const total = Number(o.total_usd) || 0;
  // Documento sin validez: rechazado/cancelado/anulado/descartado → marca de agua
  const voided = ['rechazado','cancelado','anulado','descartado','descartada'].includes(String(o.status || '').toLowerCase());

  // Monto neto de productos (sin IVA)
  const montoNeto = items.reduce((sum, i) => sum + Number(i.subtotal_usd ?? ((Number(i.price_usd) || 0) * (Number(i.qty) || 0))), 0);

  // Descuento sobre monto neto
  const descMonto = (o.discount_status === 'approved' && Number(o.discount_pct) > 0)
    ? montoNeto * Number(o.discount_pct) / 100 : 0;
  const baseAfterDiscount = montoNeto - descMonto;

  // Costo de envío
  const envio = (o.delivery_type === 'delivery') ? (Number(o.delivery_fee_usd) || 0) : 0;

  // Base Imponible y cálculo de IVA aditivo (16% global)
  const ivaPct = (s.iva_pct !== undefined && s.iva_pct !== '') ? parseFloat(s.iva_pct) : 16;
  const baseImponible = baseAfterDiscount + envio;
  const montoIva = ivaPct > 0 ? (baseImponible * ivaPct / 100) : 0;
  const totalConIva = baseImponible + montoIva;

  // Textos y logo personalizables
  const bizName  = s.business_name || s.site_name || 'JJ Paper';
  const TITLES   = { factura:'FACTURA', recibo:'ORDEN DE RECIBO', presupuesto:'PRESUPUESTO', comprobante:(s.doc_title || 'COMPROBANTE') };
  const docTitle = TITLES[docType] || (s.doc_title || 'COMPROBANTE');
  const logoUrl  = s.doc_logo_url || 'assets/img/logo.svg';
  const legal    = docType === 'presupuesto'
    ? 'Presupuesto sin validez fiscal. Precios sujetos a cambio según la tasa del día y la disponibilidad de inventario.'
    : docType === 'recibo'
      ? 'Orden de recibo / entrega de mercancía. La firma del cliente deja constancia de recepción conforme.'
      : (s.doc_footer_legal !== undefined && s.doc_footer_legal !== ''
          ? s.doc_footer_legal
          : 'Este documento es un comprobante interno de la operación y NO constituye una factura fiscal a los efectos del SENIAT.');
  // Etiquetas del área de firma según el tipo de documento
  // Una sola línea para firma y fecha; el sello va en su propio recuadro al lado
  const signLabels = {
    factura:     ['Firma y fecha del cliente'],
    recibo:      ['Recibí conforme — firma y fecha'],
    presupuesto: ['Firma de aceptación y fecha'],
    comprobante: ['Firma y fecha'],
  }[docType] || ['Firma y fecha'];
  const footNote = s.doc_footer_note || 'Gracias por su compra.';
  // El texto legal se escribe desde Ajustes y suele pegarse entre comillas:
  // se limpian para que no salgan impresas en el documento.
  const legalLimpio = String(legal || '').trim().replace(/^["“”']+|["“”']+$/g, '');
  const method = { pago_movil:'Pago Móvil', transferencia:'Transferencia', efectivo:'Efectivo' }[o.payment_method] || o.payment_method || '—';
  const condicion = (o.payment_ref || ['pagado','preparando','entregado'].includes(o.status)) ? 'Contado' : 'Por confirmar';

  // Una línea de la tabla (5 columnas limpias: Código, Descripción, Cant., Precio Unit., Total)
  const rows = items.map(i => {
    const sub = Number(i.subtotal_usd ?? i.price_usd * i.qty) || 0;
    return `<tr>
      <td class="c" style="color:#888;font-size:10.5px;white-space:nowrap">${escapeHTML(i.sku || '—')}</td>
      <td>${escapeHTML(i.name || i.product || '—')}${i.brand ? ` <small style="color:#888">(${escapeHTML(i.brand)})</small>` : ''}</td>
      <td class="c">${i.qty} ${escapeHTML(i.unit || '')}</td>
      <td class="r">${fmtPrice(i.price_usd)}</td>
      <td class="r">${fmtPrice(sub)}</td>
    </tr>`;
  }).join('');

  return `
  <div class="sheet">
    ${voided ? '<div class="voidmark"><span>Anulado</span></div>' : ''}

    <div class="fisc-head">
      <div class="fisc-biz">
        <img src="${escapeHTML(logoUrl)}" alt="">
        <div style="min-width:0">
          <div class="razon">${escapeHTML(bizName)}</div>
          ${s.rif ? `<div class="rif">RIF: ${escapeHTML(s.rif)}</div>` : ''}
          <div class="dir">
            ${s.address ? `<span class="et">Domicilio fiscal:</span> ${escapeHTML(s.address)}<br>` : ''}
            ${(s.phone_display || s.whatsapp_number) ? `<span class="et">Teléfono:</span> ${escapeHTML(s.phone_display || s.whatsapp_number)}` : ''}
            ${s.email ? `${(s.phone_display || s.whatsapp_number) ? ' · ' : ''}<span class="et">Correo:</span> ${escapeHTML(s.email)}` : ''}
          </div>
        </div>
      </div>
      <div class="fisc-doc">
        <div class="tipo">${o.invoice_number && docType === 'factura' ? 'FACTURA FISCAL' : escapeHTML(docTitle)}</div>
        ${o.invoice_number ? `
          <div class="fila"><span class="et">Factura N°</span><span class="vl" style="color:#0f172a;font-size:15px;font-weight:900">${escapeHTML(o.invoice_number)}</span></div>
          <div class="fila"><span class="et">Pedido N°</span><span class="vl">${escapeHTML(o.order_number || '')}</span></div>
        ` : `
          <div class="fila"><span class="et">N°</span><span class="vl">${escapeHTML(o.order_number || '')}</span></div>
        `}
        ${o.control_number ? `<div class="fila control"><span class="et">N° de Control SENIAT</span><span class="vl">${escapeHTML(o.control_number)}</span></div>` : ''}
        <div class="fila"><span class="et">Fecha de emisión</span><span class="vl">${fmtDate(o.invoice_date || o.created_at)}</span></div>
        ${isQuote ? '' : `<div class="fila"><span class="et">Condición</span><span class="vl">${condicion}</span></div>`}
      </div>
    </div>

    <div class="fisc-cli">
      <div class="cab">Datos del cliente</div>
      <div class="cuerpo">
        <div class="campo full"><span class="et">Razón social / Nombre:</span><span class="vl">${escapeHTML(o.client_name || '—')}</span></div>
        <div class="campo"><span class="et">RIF / C.I.:</span><span class="vl">${escapeHTML(o.rif || '—')}</span></div>
        <div class="campo"><span class="et">Teléfono:</span><span class="vl">${escapeHTML(o.phone || '—')}</span></div>
        <div class="campo full"><span class="et">Domicilio fiscal:</span><span class="vl">${escapeHTML([o.address, o.city].filter(Boolean).join(', ') || '—')}</span></div>
        ${isQuote ? '' : `
        <div class="campo"><span class="et">Forma de pago:</span><span class="vl">${escapeHTML(method)}</span></div>
        <div class="campo"><span class="et">Referencia:</span><span class="vl">${escapeHTML(o.payment_ref || '—')}</span></div>`}
      </div>
    </div>

    <table>
      <thead><tr>
        <th class="c" style="width:96px">Código</th>
        <th>Descripción</th>
        <th class="c" style="width:82px">Cant.</th>
        <th class="r" style="width:92px">Precio Unit.</th>
        <th class="r" style="width:104px">Total</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="fisc-tot">
      <table>
        ${descMonto > 0 ? `
        <tr><td class="et">Subtotal</td><td class="vl">${fmtPrice(montoNeto)}</td></tr>
        <tr><td class="et">Descuento ${o.discount_pct}%</td><td class="vl">−${fmtPrice(descMonto)}</td></tr>` : ''}
        ${o.delivery_type === 'delivery' ? `
        <tr><td class="et">Envío${o.delivery_distance_km ? ` (~${o.delivery_distance_km} km)` : ''}</td>
            <td class="vl">${envio > 0 ? fmtPrice(envio) : 'Gratis'}</td></tr>` : ''}
        ${ivaPct > 0 ? `
        <tr class="sep"><td class="et">Base imponible (Subtotal)</td><td class="vl">${fmtPrice(baseImponible)}</td></tr>
        <tr><td class="et">IVA (${ivaPct}%)</td><td class="vl">${fmtPrice(montoIva)}</td></tr>` : ''}
        <tr class="grand"><td class="et">TOTAL A PAGAR (USD)</td><td class="vl">${fmtPrice(totalConIva)}</td></tr>
        ${s.doc_show_bs === '0' ? '' : `
        <tr class="bs"><td class="et">TOTAL (Bs)</td><td class="vl">${fmtBsNum(totalConIva * rate)}</td></tr>
        <tr class="tasa"><td class="et">Tasa BCV del día</td><td class="vl" style="font-weight:400">Bs ${rate.toFixed(2)} / $</td></tr>`}
      </table>
    </div>

    <div class="sign-area">
      <div class="sign-box"><span class="ln">${signLabels[0]}</span></div>
      <div class="sello">Sello</div>
    </div>

    <div class="fisc-aviso">
      ${(o.invoice_number && docType === 'factura')
        ? `<strong>FACTURA FISCAL OFICIAL N° ${escapeHTML(o.invoice_number)}</strong> — Documento fiscal emitido en Caja MixNet. Conforme a las providencias administrativas del SENIAT.`
        : `<strong>Documento sin valor fiscal.</strong> ${escapeHTML(legalLimpio)}`
      }
    </div>

    <div class="cmp-foot">
      ${o.notes ? '<p><strong>Notas:</strong> ' + escapeHTML(o.notes) + '</p>' : ''}
      <p>${escapeHTML(bizName)} · ${escapeHTML(footNote)}</p>
    </div>
  </div>`;
}
</script>
</body>
</html>
