<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobante | JJ Paper</title>
<link rel="icon" href="assets/img/logo.svg">
<style>
  /* Colores personalizables desde Ajustes (jjp_settings.doc_color / doc_accent) */
  :root { --doc-c:#16604A; --doc-a:#C9A24B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#1a1a1a; background:#eef1f0; padding:20px; }
  .sheet { max-width:820px; margin:0 auto; background:#fff; padding:34px 38px; border-radius:8px;
    box-shadow:0 4px 24px rgba(0,0,0,.1); }
  .cmp-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    border-bottom:3px solid var(--doc-c); padding-bottom:16px; margin-bottom:8px; }
  .cmp-biz { display:flex; gap:12px; align-items:center; }
  .cmp-biz img { width:56px; height:56px; object-fit:contain; }
  .cmp-biz h1 { font-size:20px; color:var(--doc-c); line-height:1.1; }
  .cmp-biz .meta { font-size:12px; color:#555; margin-top:3px; }
  .cmp-doc { text-align:right; }
  .cmp-doc .tag { display:inline-block; background:var(--doc-c); color:#fff; font-weight:700;
    font-size:12px; padding:4px 10px; border-radius:5px; letter-spacing:.5px; }
  .cmp-doc .num { font-size:20px; font-weight:800; margin-top:6px; }
  .cmp-doc .date { font-size:12px; color:#555; }
  .cmp-parties { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:18px 0; }
  .cmp-parties .box { background:#f6f8f7; border-radius:8px; padding:12px 14px; }
  .cmp-parties h3 { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--doc-c); margin-bottom:6px; }
  .cmp-parties p { font-size:13px; line-height:1.5; }
  table { width:100%; border-collapse:collapse; margin-top:6px; }
  thead th { background:var(--doc-c); color:#fff; font-size:12px; text-align:left; padding:8px 10px; }
  thead th.r { text-align:right; } thead th.c { text-align:center; }
  tbody td { padding:8px 10px; border-bottom:1px solid #e5e9e7; font-size:13px; }
  tbody td.r { text-align:right; } tbody td.c { text-align:center; }
  tfoot td { padding:6px 10px; font-size:13px; }
  tfoot td.lbl { text-align:right; font-weight:600; color:#444; }
  tfoot td.val { text-align:right; font-weight:700; width:150px; }
  tfoot tr.total td { font-size:16px; color:var(--doc-c); border-top:2px solid var(--doc-c); padding-top:10px; }
  tfoot tr.bs td { color:var(--doc-a); }
  .cmp-foot { margin-top:22px; border-top:1px solid #e5e9e7; padding-top:14px; font-size:11px; color:#777; line-height:1.6; }
  .cmp-legal { font-style:italic; }
  .toolbar { max-width:820px; margin:0 auto 14px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .btn { border:0; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn-p { background:var(--doc-c); color:#fff; }
  .btn-g { background:#dfe5e2; color:var(--doc-c); }
  .loading, .err { max-width:820px; margin:40px auto; text-align:center; color:#555; }
  .err { color:#b00; }

  /* ---- Marca de agua ANULADO (documentos rechazados/cancelados) ---- */
  .voidmark { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:50; }
  .voidmark span { font-size:104px; font-weight:900; color:rgba(176,0,0,.15); border:8px solid rgba(176,0,0,.15);
    border-radius:16px; padding:4px 40px; transform:rotate(-20deg); letter-spacing:10px; text-transform:uppercase; }
  body.ticket .voidmark span { font-size:52px; padding:2px 20px; letter-spacing:5px; border-width:5px; }

  /* ---- Formato ticket (impresora térmica 80mm / recibo compacto) ---- */
  body.ticket { background:#fff; padding:8px; }
  body.ticket .sheet { max-width:340px; padding:14px 12px; box-shadow:none; border:1px dashed #bbb; border-radius:0;
    font-size:12px; }
  body.ticket .cmp-head { flex-direction:column; align-items:center; text-align:center; gap:6px;
    border-bottom-width:2px; padding-bottom:10px; }
  body.ticket .cmp-biz { flex-direction:column; gap:4px; text-align:center; }
  body.ticket .cmp-biz img { width:44px; height:44px; }
  body.ticket .cmp-biz h1 { font-size:16px; }
  body.ticket .cmp-doc { text-align:center; }
  body.ticket .cmp-doc .num { font-size:16px; margin-top:4px; }
  body.ticket .cmp-parties { grid-template-columns:1fr; gap:8px; margin:10px 0; }
  body.ticket .cmp-parties .box { padding:8px 10px; }
  body.ticket thead th, body.ticket tbody td { padding:5px 6px; font-size:11px; }
  body.ticket tfoot td { padding:4px 6px; font-size:12px; }
  body.ticket tfoot td.val { width:auto; }
  body.ticket tfoot tr.total td { font-size:14px; }
  body.ticket .cmp-foot { margin-top:12px; padding-top:8px; font-size:10px; text-align:center; }

  @media print {
    body { background:#fff; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sheet { box-shadow:none; border-radius:0; max-width:none; padding:16px 20px; }
    .toolbar { display:none; }
    @page { margin:12mm; }
    body.ticket .sheet { border:0; max-width:none; padding:2mm; }
    body.ticket { padding:0; }
  }
</style>
<!-- Tamaño de página dinámico: en formato ticket usa rollo 80mm; en carta, hoja normal -->
<style id="pageStyle"></style>
</head>
<body>
<div class="toolbar" id="toolbar" style="display:none">
  <button class="btn btn-g" id="fmtBtn" onclick="toggleFormat()">🧾 Ver como ticket</button>
  <button class="btn btn-p" onclick="window.print()">🖨️ Imprimir</button>
  <button class="btn btn-g" onclick="window.close()">Cerrar</button>
</div>
<div id="content"><div class="loading">Cargando comprobante…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin/auth.js"></script>
<script>
let ORDER = null;

(async () => {
  const content = document.getElementById('content');
  const session = await requireAuth('vendedor');   // admin o vendedor
  if (!session) return;
  await loadSettings();
  applyDocTheme();

  const params = new URLSearchParams(location.search);
  const orderNum = params.get('n');
  const quoteNum = params.get('q');   // ?q=<quote_number> → imprime PRESUPUESTO
  if (!orderNum && !quoteNum) { content.innerHTML = '<div class="err">Falta el número de documento (?n=... o ?q=...)</div>'; return; }

  // Formato inicial: ?f=ticket|carta manda; si no, el ajuste doc_paper
  const s = APP.SETTINGS || {};
  const f = params.get('f') || s.doc_paper || 'carta';
  setFormat(f === 'ticket');

  let docData, isQuote = false;
  if (quoteNum) {
    isQuote = true;
    const { data: q, error } = await sb.from('jjp_quotes').select('*').eq('quote_number', quoteNum).maybeSingle();
    if (error || !q) { content.innerHTML = '<div class="err">No se encontró la cotización ' + escapeHTML(quoteNum) + '.</div>'; return; }
    docData = normalizeQuote(q);
  } else {
    const { data: o, error } = await sb.from('jjp_orders').select('*').eq('order_number', orderNum).maybeSingle();
    if (error || !o) { content.innerHTML = '<div class="err">No se encontró el pedido ' + escapeHTML(orderNum) + '.</div>'; return; }
    docData = o;
  }

  ORDER = docData;
  render(docData, isQuote);
  document.getElementById('toolbar').style.display = 'flex';
  if (params.get('print') === '1') setTimeout(() => window.print(), 400);
})();

// Convierte una cotización (jjp_quotes) en un objeto con la MISMA forma que un
// pedido para reusar render(). Es solo para imprimir: no persiste nada.
function normalizeQuote(q) {
  const items = typeof q.items === 'string' ? JSON.parse(q.items) : (q.items || []);
  const subtotal = items.reduce((sum, i) => sum + Number(i.subtotal_usd ?? (Number(i.price_usd) || 0) * (Number(i.qty) || 0)), 0);
  const total = Number(q.estimated_total_usd) || subtotal;
  return {
    order_number: q.quote_number,
    client_name: q.client_name, rif: q.rif, phone: q.phone, email: q.email,
    city: q.city, address: q.address,
    items, subtotal_usd: subtotal, total_usd: total,
    discount_pct: q.discount_pct,
    discount_status: Number(q.discount_pct) > 0 ? 'approved' : 'none',
    exchange_rate: q.exchange_rate,
    payment_method: null, payment_ref: null,
    notes: q.notes, status: q.status, created_at: q.created_at,
  };
}

// Aplica colores/tema del documento configurados en Ajustes
function applyDocTheme() {
  const s = APP.SETTINGS || {};
  const okColor = c => /^#[0-9a-fA-F]{3,8}$/.test((c || '').trim());
  if (okColor(s.doc_color))  document.documentElement.style.setProperty('--doc-c', s.doc_color.trim());
  if (okColor(s.doc_accent)) document.documentElement.style.setProperty('--doc-a', s.doc_accent.trim());
}

function setFormat(ticket) {
  document.body.classList.toggle('ticket', ticket);
  const btn = document.getElementById('fmtBtn');
  if (btn) btn.textContent = ticket ? '📄 Ver como carta' : '🧾 Ver como ticket';
  // En ticket, la hoja de impresión se ajusta al rollo térmico de 80mm
  const ps = document.getElementById('pageStyle');
  if (ps) ps.textContent = ticket ? '@media print{ @page{ size:80mm auto; margin:4mm 3mm } }' : '';
}
function toggleFormat() { setFormat(!document.body.classList.contains('ticket')); }

function render(o, isQuote) {
  const s = APP.SETTINGS || {};
  const items = typeof o.items === 'string' ? JSON.parse(o.items) : (o.items || []);
  const rate = Number(o.exchange_rate) || getRate();
  const total = Number(o.total_usd) || 0;
  // Documento sin validez: rechazado/cancelado/anulado/descartado → marca de agua
  const voided = ['rechazado','cancelado','anulado','descartado','descartada'].includes(String(o.status || '').toLowerCase());

  // IVA desglosado sobre precios IVA-incluido (configurable jjp_settings.iva_pct, def 16; 0 = no desglosar)
  const ivaPct = s.iva_pct !== undefined && s.iva_pct !== '' ? parseFloat(s.iva_pct) : 16;
  let ivaRows = '';
  if (ivaPct > 0) {
    const base = total / (1 + ivaPct / 100);
    const iva  = total - base;
    ivaRows = `
      <tr><td colspan="3" class="lbl">Base imponible</td><td class="val">${fmtPrice(base)}</td></tr>
      <tr><td colspan="3" class="lbl">IVA (${ivaPct}%)</td><td class="val">${fmtPrice(iva)}</td></tr>`;
  }

  const discRow = (o.discount_status === 'approved' && o.discount_pct > 0)
    ? `<tr><td colspan="3" class="lbl">Descuento ${o.discount_pct}%</td><td class="val">−${fmtPrice((Number(o.subtotal_usd)||total) - total)}</td></tr>` : '';

  // Total en Bs (ocultable con doc_show_bs = '0')
  const bsRow = (s.doc_show_bs === '0') ? '' :
    `<tr class="bs"><td colspan="3" class="lbl">TOTAL (Bs)</td><td class="val">${fmtBsNum(total * rate)}</td></tr>`;

  const rows = items.map(i => `<tr>
    <td>${escapeHTML(i.name || i.product || '—')}${i.brand ? ` <small style="color:#888">(${escapeHTML(i.brand)})</small>` : ''}</td>
    <td class="c">${i.qty} ${escapeHTML(i.unit || '')}</td>
    <td class="r">${fmtPrice(i.price_usd)}</td>
    <td class="r">${fmtPrice(i.subtotal_usd ?? i.price_usd * i.qty)}</td>
  </tr>`).join('');

  // Textos y logo personalizables
  const bizName  = s.business_name || s.site_name || 'JJ Paper';
  const docTitle = isQuote ? 'PRESUPUESTO' : (s.doc_title || 'COMPROBANTE');
  const logoUrl  = s.doc_logo_url || 'assets/img/logo.svg';
  const legal    = isQuote
    ? 'Presupuesto sin validez fiscal. Precios sujetos a cambio según la tasa del día y la disponibilidad de inventario.'
    : (s.doc_footer_legal !== undefined && s.doc_footer_legal !== ''
        ? s.doc_footer_legal
        : 'Este documento es un comprobante interno de la operación y NO constituye una factura fiscal a los efectos del SENIAT.');
  const footNote = s.doc_footer_note || 'Gracias por su compra.';
  const method = { pago_movil:'Pago Móvil', transferencia:'Transferencia', efectivo:'Efectivo' }[o.payment_method] || o.payment_method || '—';

  document.getElementById('content').innerHTML = `
  ${voided ? '<div class="voidmark"><span>Anulado</span></div>' : ''}
  <div class="sheet">
    <div class="cmp-head">
      <div class="cmp-biz">
        <img src="${escapeHTML(logoUrl)}" alt="">
        <div>
          <h1>${escapeHTML(bizName)}</h1>
          <div class="meta">
            ${s.rif ? 'RIF: ' + escapeHTML(s.rif) + '<br>' : ''}
            ${s.address ? escapeHTML(s.address) + '<br>' : ''}
            ${s.whatsapp_number ? '📱 ' + escapeHTML(s.phone_display || s.whatsapp_number) : ''}
          </div>
        </div>
      </div>
      <div class="cmp-doc">
        <span class="tag">${escapeHTML(docTitle)}</span>
        <div class="num">${escapeHTML(o.order_number)}</div>
        <div class="date">${fmtDate(o.created_at)}</div>
      </div>
    </div>

    <div class="cmp-parties">
      <div class="box">
        <h3>Cliente</h3>
        <p><strong>${escapeHTML(o.client_name)}</strong><br>
        ${o.rif ? 'RIF/CI: ' + escapeHTML(o.rif) + '<br>' : ''}
        ${o.phone ? '📱 ' + escapeHTML(o.phone) + '<br>' : ''}
        ${o.city ? escapeHTML(o.city) + '<br>' : ''}
        ${o.address ? escapeHTML(o.address) : ''}</p>
      </div>
      <div class="box">
        <h3>Datos del documento</h3>
        <p>${isQuote
            ? 'Tipo: <strong>Cotización</strong><br>'
            : 'Método de pago: <strong>' + method + '</strong><br>'}
        ${(!isQuote && o.payment_ref) ? 'Referencia: ' + escapeHTML(o.payment_ref) + '<br>' : ''}
        Tasa del día: Bs ${rate.toFixed(2)} / $<br>
        Estado: ${escapeHTML(o.status || '')}</p>
      </div>
    </div>

    <table>
      <thead><tr>
        <th>Producto</th><th class="c">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot>
        ${discRow}
        ${ivaRows}
        <tr class="total"><td colspan="3" class="lbl">TOTAL (USD)</td><td class="val">${fmtPrice(total)}</td></tr>
        ${bsRow}
      </tfoot>
    </table>

    <div class="cmp-foot">
      ${o.notes ? '<p><strong>Notas:</strong> ' + escapeHTML(o.notes) + '</p>' : ''}
      ${legal ? '<p class="cmp-legal">' + escapeHTML(legal) + '</p>' : ''}
      <p>${escapeHTML(bizName)} · ${escapeHTML(footNote)}</p>
    </div>
  </div>`;
}
</script>
</body>
</html>
