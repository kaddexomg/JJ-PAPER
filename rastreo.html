<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Consulta el estado de tu pedido o cotización en JJ Paper con tu número y teléfono.">
<title>Rastrear pedido | JJ Paper</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<meta name="theme-color" content="#16604A">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/catalog.css">
<link rel="stylesheet" href="assets/css/cart.css">
<link rel="stylesheet" href="assets/css/chatbot.css?v=20260710b">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/glass.css">
<link rel="stylesheet" href="assets/css/fx-buttons.css?v=20260717b">
<style>
.trk-wrap { max-width:640px; margin:0 auto }
.trk-card { background:#fff; border-radius:var(--r); padding:30px; box-shadow:var(--sh); margin-bottom:22px }

/* Tabs Pedido / Cotización */
.trk-tabs { display:flex; gap:8px; margin-bottom:18px }
.trk-tab  { flex:1; padding:11px; border-radius:var(--rs); border:2px solid var(--gb);
            background:#fff; font-size:13px; font-weight:700; color:#666; transition:var(--tr) }
.trk-tab.on { background:var(--gd); border-color:var(--gd); color:#fff }
.trk-tab:hover:not(.on) { border-color:var(--gd); color:var(--gd) }

.trk-form { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end }
.trk-hint { font-size:12px; color:var(--gr); margin-top:10px }
.trk-mine { margin-top:14px; display:flex; flex-wrap:wrap; gap:8px }
.trk-mine button { background:var(--gx); color:var(--gd); font-size:11px; font-weight:700;
                   padding:6px 12px; border-radius:14px; transition:var(--tr) }
.trk-mine button:hover { background:var(--gd); color:#fff }

/* Resultado */
.trk-res-hd { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:20px }
.trk-num  { font-size:18px; font-weight:800; color:var(--gd) }
.trk-date { font-size:12px; color:var(--gr) }
.trk-bad  { background:#fdecea; border-radius:var(--rs); color:var(--danger);
            padding:14px 16px; font-size:13px; font-weight:600; margin-bottom:14px }

/* Timeline de estados */
.trk-steps { display:flex; flex-direction:column; gap:0; margin:18px 0 }
.trk-step  { display:flex; gap:14px; position:relative; padding-bottom:26px }
.trk-step:last-child { padding-bottom:0 }
.trk-step::before { content:''; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:#e5e5e5 }
.trk-step:last-child::before { display:none }
.trk-dot { width:32px; height:32px; border-radius:50%; background:#eee; color:#aaa; z-index:1;
           display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0 }
.trk-step.done .trk-dot    { background:var(--gx); color:var(--gd) }
.trk-step.current .trk-dot { background:var(--gd); color:#fff; box-shadow:0 0 0 5px rgba(103,164,39,.26) }
.trk-step.done::before     { background:var(--gm) }
.trk-lbl  { font-size:13px; font-weight:700; color:#999; padding-top:6px }
.trk-step.done .trk-lbl,
.trk-step.current .trk-lbl { color:var(--bk) }
.trk-lbl small { display:block; font-weight:500; color:var(--gr); font-size:11px; margin-top:2px }

/* Estado actual en grande (lo primero que ve el cliente) */
.trk-now { display:flex; align-items:center; gap:12px; border-radius:var(--rs); padding:14px 16px;
           font-size:15px; font-weight:800; margin-bottom:16px }
.trk-now .ico { font-size:24px }
.trk-now small { display:block; font-weight:600; font-size:11px; opacity:.75; margin-top:2px }
.trk-now.ok   { background:var(--gx); color:var(--gd) }
.trk-now.wait { background:#fff8e6; color:#9a6b00 }
.trk-now.bad  { background:#fdecea; color:var(--danger) }

.trk-sub { display:flex; justify-content:space-between; font-size:13px; color:#555; padding:3px 0 }
.trk-tot { display:flex; justify-content:space-between; border-top:1px solid #f0f0f0;
           padding-top:14px; margin-top:6px; font-size:14px }
.trk-tot b { color:var(--gd) }
@media (max-width:560px) {
  .trk-form { grid-template-columns:1fr }
  .trk-card { padding:20px }
}
.trk-items { margin-top:8px; font-size:12px; color:#555 }
.trk-items li { padding:3px 0; border-bottom:1px dashed #f2f2f2; list-style:none;
                display:flex; justify-content:space-between; gap:10px }
</style>
</head>
<body>

<div id="nav-placeholder"></div>
<div id="cart-placeholder"></div>

<div class="page-offset">
  <div class="page-hero">
    <h1>Rastrear <em>Pedido</em></h1>
    <p>Consulta el estado de tu pedido o cotización con tu número y el teléfono que registraste.</p>
  </div>
</div>

<section style="background:var(--gl)">
  <div class="trk-wrap">
    <div class="trk-card rv vi">
      <div class="trk-tabs" role="tablist" aria-label="Tipo de rastreo">
        <button class="trk-tab on" id="tabOrder" role="tab" aria-selected="true" onclick="setTrkMode('order')">📦 Pedido</button>
        <button class="trk-tab" id="tabQuote" role="tab" aria-selected="false" onclick="setTrkMode('quote')">📋 Cotización</button>
      </div>
      <div class="trk-form">
        <div class="fg"><label class="fl" id="trkNumLbl" for="trk-num">N° de pedido</label>
          <input type="text" class="fi" id="trk-num" placeholder="JJP-260701-1234" onkeydown="if(event.key==='Enter')track()"></div>
        <div class="fg"><label class="fl" for="trk-tel">Teléfono</label>
          <input type="tel" class="fi" id="trk-tel" placeholder="0412-1234567" onkeydown="if(event.key==='Enter')track()"></div>
        <button class="btn-p" id="trkBtn" onclick="track()">Buscar</button>
      </div>
      <p class="trk-hint" id="trkHint">El número de pedido te lo dimos al confirmar la compra (también llega en el mensaje de WhatsApp).</p>
      <div class="trk-mine" id="trkMine"></div>
    </div>

    <div id="trkResult"></div>
  </div>
</section>

<div id="footer-placeholder"></div>
<div id="chatbot-placeholder"></div>
<button class="btt" id="btt" aria-label="Volver arriba" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="toast-c" id="toastC"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/chatbot.js?v=20260716"></script>
<script>
let trkMode = 'order';   // 'order' | 'quote'

const ORDER_FLOW = ['pendiente_pago', 'verificando', 'pagado', 'preparando', 'entregado'];
const ORDER_LBL = {
  pendiente_pago: ['🕐', 'Pedido recibido — pendiente de pago'],
  verificando:    ['🔍', 'Verificando tu pago'],
  pagado:         ['✅', 'Pago confirmado'],
  preparando:     ['📦', 'Preparando tu pedido'],
  entregado:      ['🚚', 'Entregado'],
};
const QUOTE_FLOW = ['pendiente', 'contactado', 'confirmado'];
const QUOTE_LBL = {
  pendiente:  ['⏳', 'Cotización recibida — en revisión'],
  contactado: ['📞', 'Un asesor te contactó con la pre-factura'],
  confirmado: ['✅', 'Cotización confirmada'],
};

function setTrkMode(mode) {
  trkMode = mode;
  const tO = document.getElementById('tabOrder'), tQ = document.getElementById('tabQuote');
  tO.classList.toggle('on', mode === 'order'); tO.setAttribute('aria-selected', mode === 'order');
  tQ.classList.toggle('on', mode === 'quote'); tQ.setAttribute('aria-selected', mode === 'quote');
  document.getElementById('trkNumLbl').textContent = mode === 'order' ? 'N° de pedido' : 'N° de cotización';
  document.getElementById('trk-num').placeholder   = mode === 'order' ? 'JJP-260701-1234' : 'JJP-202607-0001';
  document.getElementById('trkHint').textContent   = mode === 'order'
    ? 'El número de pedido te lo dimos al confirmar la compra (también llega en el mensaje de WhatsApp).'
    : 'El número de cotización aparece al enviar el formulario de Pedidos o al cotizar por el chat.';
  document.getElementById('trkResult').innerHTML = '';
  renderMine();
}

function fmtDateTime(iso) {
  return new Date(iso).toLocaleDateString('es-VE', { day:'2-digit', month:'2-digit', year:'numeric' })
    + ' ' + new Date(iso).toLocaleTimeString('es-VE', { hour:'2-digit', minute:'2-digit' });
}

async function track() {
  // El número no distingue mayúsculas y el teléfono acepta cualquier formato
  // (la RPC compara solo los dígitos): menos "no encontrado" por detalles.
  const num = document.getElementById('trk-num').value.trim().toUpperCase();
  const tel = document.getElementById('trk-tel').value.trim();
  const out = document.getElementById('trkResult');
  if (!num) { showToast('Ingresa tu número', 'warn'); return; }
  if (!tel) { showToast('Ingresa tu teléfono', 'warn'); return; }

  const btn = document.getElementById('trkBtn');
  btn.disabled = true; btn.textContent = 'Buscando...';
  out.innerHTML = '';

  const rpc  = trkMode === 'order' ? 'jjp_track_order' : 'jjp_track_quote';
  const args = trkMode === 'order'
    ? { p_order_number: num, p_phone: tel }
    : { p_quote_number: num, p_phone: tel };
  let { data, error } = await sb.rpc(rpc, args);

  // Si no aparece en el modo actual, intenta el otro automáticamente
  if (!data && !error) {
    const alt = trkMode === 'order'
      ? await sb.rpc('jjp_track_quote', { p_quote_number: num, p_phone: tel })
      : await sb.rpc('jjp_track_order', { p_order_number: num, p_phone: tel });
    if (alt.data) {
      setTrkMode(trkMode === 'order' ? 'quote' : 'order');
      document.getElementById('trk-num').value = num;
      document.getElementById('trk-tel').value = tel;
      data = alt.data;
    }
  }

  btn.disabled = false; btn.textContent = 'Buscar';

  if (error || !data) {
    out.innerHTML = `<div class="trk-card">
      <div class="trk-bad">No encontramos ${trkMode === 'order' ? 'un pedido' : 'una cotización'} con esos datos. Verifica el número y que el teléfono sea el mismo que registraste.</div>
      <a class="btn-wa" href="#" onclick="openWA('Hola JJ Paper, necesito ayuda con mi número ' + document.getElementById('trk-num').value); return false">💬 Pedir ayuda por WhatsApp</a>
    </div>`;
    return;
  }

  out.innerHTML = trkMode === 'order' ? renderOrderResult(data) : renderQuoteResult(data);
}

function stepDates(history) {
  // Mapa estado → fecha más reciente en el historial
  const map = {};
  (Array.isArray(history) ? history : []).forEach(h => { if (h.status) map[h.status] = h.at; });
  return map;
}

function renderOrderResult(o) {
  const isDead  = (o.status === 'rechazado' || o.status === 'cancelado');
  const curIdx  = ORDER_FLOW.indexOf(o.status);
  const dates   = stepDates(o.status_history);

  const stepsHTML = ORDER_FLOW.map((s, i) => {
    const cls = isDead ? '' : (i < curIdx ? 'done' : i === curIdx ? 'current' : '');
    const [ico, lbl] = ORDER_LBL[s];
    const when = (cls && dates[s]) ? `<small>${fmtDateTime(dates[s])}</small>` : '';
    return `<div class="trk-step ${cls}"><div class="trk-dot">${ico}</div><div class="trk-lbl">${lbl}${when}</div></div>`;
  }).join('');

  const deadHTML = isDead
    ? `<div class="trk-bad">${o.status === 'rechazado'
        ? '❌ El pago de este pedido fue rechazado. Escríbenos por WhatsApp para resolverlo.'
        : '🚫 Este pedido fue cancelado.'}${dates[o.status] ? `<br><small>${fmtDateTime(dates[o.status])}</small>` : ''}</div>`
    : '';

  // Estado actual en grande: lo primero que quiere saber el cliente
  const [nowIco, nowLbl] = ORDER_LBL[o.status] || ['📦', o.status];
  const nowCls = isDead ? 'bad'
    : ['pagado', 'preparando', 'entregado'].includes(o.status) ? 'ok' : 'wait';
  const nowHTML = isDead ? '' : `<div class="trk-now ${nowCls}">
    <span class="ico">${nowIco}</span>
    <span>${nowLbl}${dates[o.status] ? `<small>${fmtDateTime(dates[o.status])}</small>` : ''}</span>
  </div>`;

  // Entrega: retiro o delivery con su costo
  const dlvHTML = o.delivery_type === 'delivery'
    ? `<div class="trk-sub"><span>Entrega 🛵 Delivery${o.delivery_distance_km ? ` (~${o.delivery_distance_km} km)` : ''}</span><span>${Number(o.delivery_fee_usd) > 0 ? fmtPrice(o.delivery_fee_usd) : '¡Gratis! 🎉'}</span></div>`
    : o.delivery_type === 'retiro'
      ? `<div class="trk-sub"><span>Entrega</span><span>🏬 Retiro en tienda</span></div>` : '';
  const subHTML = dlvHTML
    ? `<div class="trk-sub"><span>Subtotal</span><span>${fmtPrice(o.subtotal_usd ?? o.total_usd)}</span></div>` : '';

  const items = Array.isArray(o.items) ? o.items : [];
  return `<div class="trk-card">
    <div class="trk-res-hd">
      <span class="trk-num">${escapeHTML(o.order_number)}</span>
      <span class="trk-date">Pedido el ${fmtDate(o.created_at)} · ${items.length} producto${items.length !== 1 ? 's' : ''}</span>
    </div>
    ${nowHTML}
    ${deadHTML}
    <div class="trk-steps">${stepsHTML}</div>
    <ul class="trk-items">${items.map(i =>
      `<li><span>${escapeHTML(i.name)}${i.brand ? ` <small style="color:var(--gm);font-weight:700">(${escapeHTML(i.brand)})</small>` : ''} x${i.qty}</span><span>${fmtPrice(i.subtotal_usd ?? i.price_usd * i.qty)}</span></li>`).join('')}
    </ul>
    ${subHTML}${dlvHTML}
    <div class="trk-tot"><span>Total</span><b>${fmtPrice(o.total_usd)} · ${fmtBsNum(o.total_bs)}</b></div>
    <a class="btn-wa" style="margin-top:16px" href="#"
       onclick="openWA('Hola JJ Paper, consulto por mi pedido ${escapeHTML(o.order_number)}'); return false">💬 Consultar por WhatsApp</a>
  </div>`;
}

function renderQuoteResult(q) {
  const isDead  = q.status === 'cancelado';
  const curIdx  = QUOTE_FLOW.indexOf(q.status);

  const stepsHTML = QUOTE_FLOW.map((s, i) => {
    const cls = isDead ? '' : (i < curIdx ? 'done' : i === curIdx ? 'current' : '');
    const [ico, lbl] = QUOTE_LBL[s];
    const when = (i === curIdx && q.updated_at) ? `<small>Actualizado: ${fmtDateTime(q.updated_at)}</small>` : '';
    return `<div class="trk-step ${cls}"><div class="trk-dot">${ico}</div><div class="trk-lbl">${lbl}${when}</div></div>`;
  }).join('');

  const items = Array.isArray(q.items) ? q.items : [];
  return `<div class="trk-card">
    <div class="trk-res-hd">
      <span class="trk-num">${escapeHTML(q.quote_number)}</span>
      <span class="trk-date">Solicitada el ${fmtDate(q.created_at)} · ${items.length} producto${items.length !== 1 ? 's' : ''}</span>
    </div>
    ${isDead ? '<div class="trk-bad">🚫 Esta cotización fue cancelada.</div>' : ''}
    <div class="trk-steps">${stepsHTML}</div>
    <ul class="trk-items">${items.map(i =>
      `<li><span>${escapeHTML(i.product || i.name || '—')} x${i.qty}${i.unit ? ' ' + escapeHTML(i.unit) : ''}</span>
       <span>${i.price_usd ? fmtPrice(i.price_usd * i.qty) : 'por confirmar'}</span></li>`).join('')}
    </ul>
    ${q.estimated_total_usd ? `<div class="trk-tot"><span>Total estimado</span><b>${fmtPrice(q.estimated_total_usd)} · ${fmtBs(q.estimated_total_usd)}</b></div>` : ''}
    <a class="btn-wa" style="margin-top:16px" href="#"
       onclick="openWA('Hola JJ Paper, consulto por mi cotización ${escapeHTML(q.quote_number)}'); return false">💬 Consultar por WhatsApp</a>
  </div>`;
}

function renderMine() {
  const box = document.getElementById('trkMine');
  const key = trkMode === 'order' ? 'jjp_my_orders' : 'jjp_my_quotes';
  let mine = [];
  try { mine = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
  if (!box) return;
  if (!mine.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<span style="font-size:11px;color:var(--gr);align-self:center">Tus ${trkMode === 'order' ? 'pedidos' : 'cotizaciones'} recientes:</span>` +
    mine.map(m => `<button onclick="prefillTrack('${escapeHTML(m.n)}','${escapeHTML(m.tel || '')}')">${escapeHTML(m.n)}</button>`).join('');
}

function prefillTrack(n, tel) {
  document.getElementById('trk-num').value = n;
  if (tel) document.getElementById('trk-tel').value = tel;
  track();
}

document.addEventListener('DOMContentLoaded', async () => {
  injectNav('');
  injectFooter();
  await loadSettings();
  renderMine();

  // Prefill: ?n= (pedido) o ?c= (cotización)
  const params = new URLSearchParams(location.search);
  const n = params.get('n'), c = params.get('c');
  if (c) setTrkMode('quote');
  const num = n || c;
  if (num) {
    document.getElementById('trk-num').value = num;
    const key = c ? 'jjp_my_quotes' : 'jjp_my_orders';
    let mine = [];
    try { mine = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
    const m = mine.find(x => x.n === num);
    if (m?.tel) { document.getElementById('trk-tel').value = m.tel; track(); }
  }
});
</script>
<script src="assets/js/fx-buttons.js?v=20260717b"></script>
</body>
</html>
