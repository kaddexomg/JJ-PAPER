  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

  .card {

  .logo-wrap {

    align-items: center;
    justify-content: center;

    margin-bottom: 24px;
  }
  .logo-wrap img {

  .error-code {

    flex-direction: column;
    gap: 12px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 22px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 12px;
    text-decoration: none;
    transition: all .2s ease;

    border: none;
  }
  .btn-primary {
    background: #16604A;
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(22,96,74,0.3);
  }
  .btn-primary:hover {
    background: #124e3c;

  }
  .btn-secondary {
    background: #f1f5f9;
    color: #334155;
  }
  .btn-secondary:hover {

</div>

<script>
  try {
    const raw = localStorage.getItem('sb-166-0-112-247-auth-token');
    if (raw) {
      const sess = JSON.parse(raw);
      if (sess && sess.access_token) {
        // Usuario logueado: ofrecer botón a su panel
        const btnMain = document.getElementById('btnMain');
        if (btnMain) {
          btnMain.textContent = '📊 Ir a mi Panel de Control';
          btnMain.href = '/admin/index.html';

      }
    }
  } catch (_) {}
