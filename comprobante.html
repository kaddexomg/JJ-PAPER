<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobante Fiscal | JJ Paper</title>
<link rel="icon" href="assets/img/logo.svg">
<style>
  /* ==========================================================
     PALETA Y ESTRUCTURA DE ALTO CONTRASTE (OPTIMIZADA PARA LÁSER B/N)
     Emula el acabado de documentos a color mediante tramas grises (halftones),
     jerarquías tipográficas y bordes nítidos.
     ========================================================== */
  :root { 
    --ink-dark: #000000;
    --ink-body: #111827;
    --ink-muted: #374151;
    --ink-subtle: #6b7280;
    
    --b-dark: #000000;
    --b-medium: #4b5563;
    --b-light: #9ca3af;
    --b-subtle: #e5e7eb;
    
    --screen-dark: #000000;
    --screen-banner: #f3f4f6;
    --screen-table: #f9fafb;
    --screen-alt: #f3f4f6;
    --screen-accent: #e5e7eb;
  }
  
  * { box-sizing:border-box; margin:0; padding:0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    color: var(--ink-body); 
    background: #e5e7eb; 
    padding: 24px 12px; 
    -webkit-font-smoothing: antialiased;
  }

  /* Hoja de papel (Carta) */
  .sheet { 
    max-width: 840px; 
    margin: 0 auto; 
    background: #ffffff; 
    padding: 34px 40px; 
    border-radius: 4px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.12); 
    border: 1.5px solid #d1d5db;
    position: relative;
  }

  /* ==========================================================
     CABECERA FISCAL PRINCIPAL
     ========================================================== */
  .fisc-head { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-start; 
    gap: 24px;
    border-bottom: 2.5px solid var(--b-dark); 
    padding-bottom: 14px; 
    margin-bottom: 14px; 
  }
  
  .fisc-biz { 
    display: flex; 
    gap: 16px; 
    align-items: flex-start; 
    flex: 1; 
    min-width: 0; 
  }
  
  .fisc-biz img { 
    width: 72px; 
    height: 72px; 
    object-fit: contain; 
    flex-shrink: 0;
    filter: grayscale(100%) contrast(150%);
  }
  
  .fisc-biz .biz-name { 
    font-size: 21px; 
    font-weight: 900; 
    color: var(--ink-dark); 
    line-height: 1.15;
    letter-spacing: 0.5px; 
    text-transform: uppercase;
  }
  
  .fisc-biz .biz-rif { 
    font-size: 13.5px; 
    font-weight: 800; 
    color: var(--ink-dark); 
    margin-top: 3px; 
    letter-spacing: 0.8px; 
  }
  
  .fisc-biz .biz-dir { 
    font-size: 11.5px; 
    color: var(--ink-muted); 
    line-height: 1.5; 
    margin-top: 5px; 
  }
  
  .fisc-biz .biz-dir strong { 
    color: var(--ink-dark); 
    text-transform: uppercase; 
    font-size: 10px; 
    letter-spacing: 0.5px; 
  }

  /* Recuadro de Documento Fiscal (Caja SENIAT de Alta Definición) */
  .fisc-doc-box { 
    border: 2px solid var(--b-dark); 
    border-radius: 5px; 
    min-width: 275px; 
    max-width: 320px;
    overflow: hidden; 
    box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
    background: #ffffff;
  }
  
  .fisc-doc-box .doc-title { 
    background: var(--screen-dark); 
    color: #ffffff; 
    text-align: center; 
    font-weight: 900;
    font-size: 14.5px; 
    letter-spacing: 2px; 
    padding: 7px 10px; 
    text-transform: uppercase; 
  }
  
  .fisc-doc-box .doc-row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    gap: 8px; 
    padding: 5px 12px;
    font-size: 12.5px; 
    border-bottom: 1px solid var(--b-subtle); 
  }
  
  .fisc-doc-box .doc-row:last-child { border-bottom: 0; }
  .fisc-doc-box .doc-row .lbl { color: var(--ink-muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; }
  .fisc-doc-box .doc-row .val { font-weight: 800; color: var(--ink-dark); text-align: right; }
  
  .fisc-doc-box .doc-row.num-row { 
    background: var(--screen-accent); 
    border-bottom: 1.5px solid var(--b-dark);
    padding: 6px 12px;
  }
  .fisc-doc-box .doc-row.num-row .val { 
    font-size: 16px; 
    font-family: "Courier New", Courier, monospace; 
    font-weight: 900; 
    letter-spacing: 0.5px;
  }

  .fisc-doc-box .doc-row.ctrl-row {
    background: #ffffff;
    border-top: 1.5px solid var(--b-dark);
    border-bottom: 1.5px solid var(--b-dark);
  }
  .fisc-doc-box .doc-row.ctrl-row .val {
    font-size: 14px;
    font-family: "Courier New", Courier, monospace;
    font-weight: 900;
  }

  /* ==========================================================
     RECUADRO DE DATOS DEL CLIENTE / RECEPTOR
     ========================================================== */
  .fisc-client-box { 
    border: 1.5px solid var(--b-dark); 
    border-radius: 5px; 
    margin: 12px 0; 
    overflow: hidden; 
  }
  
  .fisc-client-box .box-header { 
    background: var(--screen-banner); 
    border-bottom: 1.5px solid var(--b-dark); 
    color: var(--ink-dark); 
    font-size: 11px; 
    font-weight: 900;
    letter-spacing: 1.2px; 
    padding: 5px 12px; 
    text-transform: uppercase; 
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .fisc-client-box .box-body { 
    display: grid; 
    grid-template-columns: 1.3fr 1fr; 
    gap: 6px 18px; 
    padding: 10px 14px; 
    background: #ffffff;
  }
  
  .fisc-client-box .f-field { 
    font-size: 12px; 
    line-height: 1.45; 
    display: flex; 
    gap: 6px; 
    min-width: 0; 
  }
  
  .fisc-client-box .f-field .f-lbl { 
    color: var(--ink-muted); 
    flex-shrink: 0; 
    font-weight: 700; 
    font-size: 11px;
    text-transform: uppercase;
  }
  
  .fisc-client-box .f-field .f-val { 
    font-weight: 700; 
    color: var(--ink-dark); 
    overflow-wrap: anywhere; 
  }
  
  .fisc-client-box .f-field.full { grid-column: 1 / -1; }

  /* ==========================================================
     TABLA DE PRODUCTOS / RENGLONES (ESTILO FACTURA FORMAL)
     ========================================================== */
  .fisc-items-table { 
    width: 100%; 
    border-collapse: collapse; 
    margin-top: 10px; 
    border: 1.5px solid var(--b-dark);
  }
  
  .fisc-items-table thead th { 
    background: var(--screen-accent); 
    color: var(--ink-dark); 
    font-size: 11px; 
    font-weight: 900; 
    text-transform: uppercase;
    text-align: left; 
    padding: 7px 8px; 
    border-bottom: 2px solid var(--b-dark); 
    border-right: 1px solid var(--b-light);
    letter-spacing: 0.3px;
  }
  
  .fisc-items-table thead th:last-child { border-right: none; }
  .fisc-items-table thead th.r { text-align: right; } 
  .fisc-items-table thead th.c { text-align: center; }
  
  .fisc-items-table tbody td { 
    padding: 6px 8px; 
    border-bottom: 1px solid var(--b-subtle); 
    border-right: 1px solid var(--b-subtle); 
    font-size: 12px; 
    color: var(--ink-body); 
    line-height: 1.35;
  }
  
  .fisc-items-table tbody tr:nth-child(even) td {
    background: var(--screen-zebra);
  }
  
  .fisc-items-table tbody td:last-child { border-right: none; }
  .fisc-items-table tbody tr:last-child td { border-bottom: 2px solid var(--b-dark); }
  .fisc-items-table tbody td.r { text-align: right; font-variant-numeric: tabular-nums; } 
  .fisc-items-table tbody td.c { text-align: center; }
  .fisc-items-table tbody td.sku-cell { font-family: "Courier New", Courier, monospace; font-weight: 700; color: var(--ink-dark); font-size: 11px; }

  /* ==========================================================
     LIQUIDACIÓN DE TOTALES (DUAL MONEDA FISCAL)
     ========================================================== */
  .fisc-tot-wrap { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-start;
    margin-top: 12px; 
    gap: 16px;
  }
  
  .fisc-tot-left {
    flex: 1;
    font-size: 11.5px;
    color: var(--ink-muted);
    border: 1px solid var(--b-light);
    border-radius: 5px;
    padding: 8px 12px;
    background: var(--screen-table);
    line-height: 1.5;
  }

  .fisc-tot-table { 
    width: auto; 
    min-width: 380px; 
    margin: 0; 
    border-collapse: collapse;
    border: 2px solid var(--b-dark); 
    border-radius: 4px;
    overflow: hidden;
  }
  
  .fisc-tot-table td { 
    padding: 5px 10px; 
    font-size: 12.5px; 
    border: 0; 
    border-bottom: 1px solid var(--b-subtle); 
  }
  
  .fisc-tot-table td.lbl { 
    text-align: right; 
    color: var(--ink-muted); 
    font-weight: 700; 
    background: var(--screen-banner); 
    border-right: 1.5px solid var(--b-light); 
    font-size: 11.5px;
    text-transform: uppercase;
  }
  
  .fisc-tot-table td.val { 
    text-align: right; 
    font-weight: 800; 
    min-width: 140px; 
    background: #ffffff; 
    color: var(--ink-dark);
    font-variant-numeric: tabular-nums;
  }
  
  .fisc-tot-table tr.grand-usd td { 
    font-size: 14.5px; 
    color: #ffffff; 
    background: var(--screen-dark); 
    font-weight: 900;
    padding: 7px 10px; 
    border-bottom: 1px solid #ffffff;
  }
  .fisc-tot-table tr.grand-usd td.lbl { 
    color: #ffffff; 
    background: var(--screen-dark); 
    border-right: 1px solid #555; 
  }

  .fisc-tot-table tr.grand-bs td { 
    font-size: 16px; 
    color: var(--ink-dark); 
    background: var(--screen-accent); 
    font-weight: 900;
    padding: 7px 10px; 
    border-bottom: 2px solid var(--b-dark);
  }
  .fisc-tot-table tr.grand-bs td.lbl { 
    background: var(--screen-accent); 
    border-right: 1.5px solid var(--b-dark); 
  }

  .fisc-tot-table tr.rate-row td { 
    font-size: 11px; 
    color: var(--ink-muted); 
    font-weight: 600; 
    background: #ffffff;
  }

  /* ==========================================================
     ÁREA DE CONFORMIDAD Y FIRMAS
     ========================================================== */
  .fisc-sign-area { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 16px; 
    margin-top: 18px; 
  }
  
  .fisc-sign-box { 
    border: 1.5px solid var(--b-dark); 
    border-radius: 4px; 
    padding: 8px 12px;
    background: #ffffff;
    font-size: 11px;
    line-height: 1.6;
  }
  
  .fisc-sign-box .box-tit {
    font-weight: 900;
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--b-subtle);
    padding-bottom: 3px;
    margin-bottom: 6px;
    color: var(--ink-dark);
  }
  
  .fisc-sign-box .sign-line {
    border-bottom: 1px dotted var(--b-medium);
    margin-top: 18px;
    margin-bottom: 4px;
  }
  
  .fisc-sign-box .sign-sub {
    font-size: 10px;
    color: var(--ink-muted);
    font-weight: 600;
    text-align: center;
    text-transform: uppercase;
  }

  /* Aviso legal y pie de página */
  .fisc-footer-note { 
    margin-top: 14px; 
    border: 1.5px dashed var(--b-medium); 
    background: var(--screen-table); 
    border-radius: 5px;
    padding: 7px 12px; 
    font-size: 10px; 
    color: var(--ink-muted); 
    line-height: 1.45; 
    text-align: center; 
  }
  
  .fisc-footer-note strong { 
    color: var(--ink-dark); 
    font-weight: 800; 
    text-transform: uppercase; 
  }

  /* Marca de agua ANULADO */
  .voidmark { 
    position: absolute; 
    inset: 0; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    pointer-events: none; 
    z-index: 50; 
  }
  .voidmark span { 
    font-size: 90px; 
    font-weight: 900; 
    color: rgba(0,0,0,0.12); 
    border: 8px solid rgba(0,0,0,0.12);
    border-radius: 16px; 
    padding: 4px 30px; 
    transform: rotate(-20deg); 
    letter-spacing: 8px; 
    text-transform: uppercase; 
  }

  /* Toolbar de navegación */
  .toolbar { 
    max-width: 840px; 
    margin: 0 auto 14px; 
    display: flex; 
    gap: 10px; 
    justify-content: flex-end; 
    flex-wrap: wrap; 
  }
  .btn { 
    border: 1.5px solid var(--b-medium); 
    border-radius: 6px; 
    padding: 8px 16px; 
    font-size: 13.5px; 
    font-weight: 700; 
    cursor: pointer; 
    text-decoration: none; 
  }
  .btn-p { background: #000000; color: #ffffff; border-color: #000000; }
  .btn-g { background: #ffffff; color: #000000; }
  .loading, .err { max-width: 840px; margin: 40px auto; text-align: center; color: var(--ink-dark); font-weight: 700; font-size: 15px; }

  /* ==========================================================
     OPTIMIZACIÓN DE IMPRESIÓN DIRECTA (BLANCO Y NEGRO LÁSER)
     ========================================================== */
  @media print { 
    * { 
      -webkit-print-color-adjust: exact !important; 
      print-color-adjust: exact !important; 
      color-adjust: exact !important;
    }
    html, body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
    .toolbar { display: none !important; }
    
    @page { 
      size: letter portrait;
      margin: 8mm 7mm 7mm 7mm;
    }
    
    .sheet { 
      box-shadow: none !important; 
      border: none !important; 
      padding: 0 !important; 
      max-width: 100% !important; 
      width: 100% !important;
      border-radius: 0 !important;
      page-break-after: avoid;
      break-inside: avoid;
    }
  }

  /* Formato ticket térmico (80mm) */
  body.ticket .sheet { max-width: 320px; padding: 10px 8px; border: 1.5px solid #000; font-size: 11px; }
  body.ticket .fisc-head { flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  body.ticket .fisc-biz { flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  body.ticket .fisc-doc-box { min-width: 0; width: 100%; }
  body.ticket .fisc-client-box .box-body { grid-template-columns: 1fr; gap: 4px; }
  body.ticket .fisc-tot-wrap { flex-direction: column; }
  body.ticket .fisc-tot-table { width: 100%; min-width: 0; }
  body.ticket .fisc-sign-area { grid-template-columns: 1fr; }
</style>
<style id="pageStyle"></style>
</head>
<body>

<div class="toolbar" id="toolbar" style="display:none">
  <select class="btn btn-g" id="docSel" onchange="setDocType(this.value)" style="display:none">
    <option value="factura">📄 Factura Fiscal</option>
    <option value="recibo">📦 Orden de Entrega / Recibo</option>
    <option value="presupuesto">📑 Presupuesto</option>
    <option value="comprobante">📃 Comprobante Interno</option>
  </select>
  <button class="btn btn-g" id="fmtBtn" onclick="toggleFormat()">📃 Ver como ticket</button>
  <button class="btn btn-p" onclick="window.print()">🖨️ Imprimir Documento</button>
  <button class="btn btn-g" onclick="window.close()">Cerrar</button>
</div>

<div id="content"><div class="loading">Cargando comprobante fiscal…</div></div>

<script src="assets/vendor/supabase-2.58.0.js"></script>
<script src="assets/js/config.js?v=20260925_correlativo"></script>
<script src="assets/js/admin/auth.js"></script>
<script>
let ORDER = null;
let DOC_TYPE = 'comprobante';

// Resuelve la información fiscal real y completa del cliente
async function resolveCustomerFiscal(doc) {
  let cust = null;
  // 1. Buscar por customer_id
  if (doc.customer_id) {
    try {
      const { data } = await sbCore.from('jjp_customers').select('*').eq('id', doc.customer_id).maybeSingle();
      if (data) cust = data;
    } catch (_) {}
  }
  // 2. Si no tiene o falta dirección, buscar por RIF exacto o limpio
  if ((!cust || !cust.address) && doc.rif) {
    const rawRif = String(doc.rif).trim();
    const cleanRif = rawRif.replace(/[^a-zA-Z0-9]/g, '');
    try {
      const { data } = await sbCore.from('jjp_customers').select('*')
        .or(`rif.eq."${rawRif}",rif.eq."${cleanRif}"`)
        .limit(1);
      if (data?.[0]) cust = cust ? { ...data[0], ...cust, address: data[0].address || cust.address } : data[0];
    } catch (_) {}
  }
  // 3. Buscar por nombre
  if ((!cust || !cust.address) && doc.client_name) {
    try {
      const qName = doc.client_name.trim().slice(0, 18);
      const { data } = await sbCore.from('jjp_customers').select('*')
        .ilike('name', `%${qName}%`)
        .limit(1);
      if (data?.[0]) cust = cust ? { ...data[0], ...cust, address: data[0].address || cust.address } : data[0];
    } catch (_) {}
  }

  const inv = doc.invoice_data || {};
  const fiscalName = (cust?.business_name || cust?.name || inv.nomcli || doc.client_name || 'CLIENTE GENERAL').trim();
  const fiscalRif = (cust?.rif || inv.cif || doc.rif || 'V-00000000-0').trim();
  const fiscalAddr = (cust?.address || doc.address || 'Caracas, Venezuela').trim();
  const fiscalCity = (cust?.city || doc.city || 'Caracas').trim();
  const fiscalPhone = (cust?.phone || doc.phone || '').trim();
  const fiscalEmail = (cust?.email || doc.email || '').trim();
  const clientCode = (inv.cliente || (cust?.notes?.match(/Zona:\s*(\w+)/)?.[1]) || '').trim();

  return {
    name: fiscalName,
    rif: fiscalRif,
    address: fiscalAddr,
    city: fiscalCity,
    phone: fiscalPhone,
    email: fiscalEmail,
    code: clientCode
  };
}

(async () => {
  const content = document.getElementById('content');
  const session = await requireAuth('vendedor');
  if (!session) return;
  await loadSettings();

  const params = new URLSearchParams(location.search);
  const orderNum = params.get('n');
  const quoteNum = params.get('q');
  const facNum   = params.get('fac');

  if (!orderNum && !quoteNum && !facNum) { 
    content.innerHTML = '<div class="err">Falta el número de documento (?n=..., ?q=... o ?fac=...)</div>'; 
    return; 
  }

  const s = APP.SETTINGS || {};
  const f = params.get('f') || s.doc_paper || 'carta';
  setFormat(f === 'ticket');

  let docData;
  if (quoteNum) {
    DOC_TYPE = 'presupuesto';
    const { data: q, error } = await sbCore.from('jjp_quotes').select('*').eq('quote_number', quoteNum).maybeSingle();
    if (error || !q) { content.innerHTML = '<div class="err">No se encontró la cotización ' + escapeHTML(quoteNum) + '.</div>'; return; }
    docData = normalizeQuote(q);
  } else {
    let t = (params.get('t') || (facNum ? 'factura' : 'comprobante')).toLowerCase().trim();
    DOC_TYPE = ['factura', 'recibo', 'comprobante', 'presupuesto'].includes(t) ? t : 'comprobante';

    let o = null;
    if (orderNum) {
      const res = await sbCore.from('jjp_orders').select('*').eq('order_number', orderNum).maybeSingle();
      o = res.data;
      if (!o) {
        const facRes = await sbCore.from('jjp_orders').select('*').eq('invoice_number', orderNum).maybeSingle();
        if (facRes.data) { o = facRes.data; DOC_TYPE = 'factura'; }
      }
    } else if (facNum) {
      const facRes = await sbCore.from('jjp_orders').select('*').eq('invoice_number', facNum).maybeSingle();
      o = facRes.data;
      DOC_TYPE = 'factura';
    }

    if (!o) { content.innerHTML = '<div class="err">No se encontró el pedido o factura ' + escapeHTML(orderNum || facNum) + '.</div>'; return; }
    docData = o;
  }

  // Resolver cliente real
  docData.customer = await resolveCustomerFiscal(docData);

  ORDER = docData;
  render(docData);
  document.getElementById('toolbar').style.display = 'flex';
  
  const ds = document.getElementById('docSel');
  if (ds && DOC_TYPE !== 'presupuesto') { ds.value = DOC_TYPE; ds.style.display = ''; }
  if (params.get('print') === '1') setTimeout(() => window.print(), 400);
})();

function setDocType(t) { DOC_TYPE = t; if (ORDER) render(ORDER); }

function normalizeQuote(q) {
  const items = typeof q.items === 'string' ? JSON.parse(q.items) : (q.items || []);
  const subtotal = items.reduce((sum, i) => sum + Number(i.subtotal_usd ?? ((Number(i.price_usd) || 0) * (Number(i.qty) || 0))), 0);
  const total = Number(q.estimated_total_usd) || subtotal;
  return {
    order_number: q.quote_number,
    client_name: q.client_name, rif: q.rif, phone: q.phone, email: q.email,
    city: q.city, address: q.address,
    customer_id: q.customer_id,
    items, subtotal_usd: subtotal, total_usd: total,
    discount_pct: q.discount_pct || 0,
    discount_status: Number(q.discount_pct) > 0 ? 'approved' : 'none',
    exchange_rate: q.exchange_rate,
    status: q.status, created_at: q.created_at,
  };
}

function setFormat(ticket) {
  document.body.classList.toggle('ticket', ticket);
  const btn = document.getElementById('fmtBtn');
  if (btn) btn.textContent = ticket ? '📄 Ver como carta' : '📃 Ver como ticket';
  const ps = document.getElementById('pageStyle');
  if (ps) ps.textContent = ticket ? '@media print{ @page{ size:80mm auto; margin:3mm } }' : '';
}
function toggleFormat() { setFormat(!document.body.classList.contains('ticket')); }

function render(o) {
  document.getElementById('content').innerHTML = sheet(o, DOC_TYPE);
}

function sheet(o, docType) {
  const s = APP.SETTINGS || {};
  const isInvoice = (docType === 'factura') || !!o.invoice_number;
  const isQuote = (docType === 'presupuesto');
  const isReceipt = (docType === 'recibo');
  
  const cust = o.customer || {
    name: o.client_name || 'CLIENTE GENERAL',
    rif: o.rif || 'V-00000000-0',
    address: o.address || 'Caracas, Venezuela',
    city: o.city || 'Caracas',
    phone: o.phone || '',
    email: o.email || '',
    code: ''
  };

  const inv = o.invoice_data || {};
  const items = Array.isArray(o.items) ? o.items : (typeof o.items === 'string' ? JSON.parse(o.items || '[]') : []);
  const rate = Number(inv.cambio || o.invoice_rate || o.exchange_rate) || getRate();
  const voided = ['rechazado','cancelado','anulado'].includes(String(o.status || '').toLowerCase());

  // Renglones de productos
  const rows = items.map((i, idx) => {
    const qty = Number(i.qty) || 1;
    const priceUsd = Number(i.price_usd) || 0;
    const subUsd = Number(i.subtotal_usd ?? (priceUsd * qty));
    const subBs = subUsd * rate;
    const unitStr = (i.unit || 'UND').toUpperCase();
    const brandStr = i.brand ? ` <span style="font-size:10.5px;color:#4b5563;font-weight:700">· [${escapeHTML(i.brand)}]</span>` : '';

    return `<tr>
      <td class="c" style="color:#6b7280;font-size:11px">${String(idx + 1).padStart(2, '0')}</td>
      <td class="c sku-cell">${escapeHTML(i.sku || '—')}</td>
      <td><strong>${escapeHTML(i.name || i.product || 'Artículo')}</strong>${brandStr}</td>
      <td class="c"><strong>${qty}</strong></td>
      <td class="c" style="font-size:11px;color:#4b5563">${escapeHTML(unitStr)}</td>
      <td class="r">${fmtPrice(priceUsd)}</td>
      <td class="r"><strong>${fmtPrice(subUsd)}</strong></td>
      <td class="r">${fmtBsNum(subBs)}</td>
    </tr>`;
  }).join('');

  // Renglones vacíos estéticos si hay pocos ítems para mantener la cuadrícula corporativa
  let emptyRows = '';
  if (items.length < 5) {
    const need = 5 - items.length;
    for (let k = 0; k < need; k++) {
      emptyRows += `<tr>
        <td class="c" style="color:#ccc;font-size:10px">${String(items.length + k + 1).padStart(2, '0')}</td>
        <td class="c" style="color:#eee">—</td>
        <td style="color:#eee">·································································································</td>
        <td class="c" style="color:#eee">—</td>
        <td class="c" style="color:#eee">—</td>
        <td class="r" style="color:#eee">—</td>
        <td class="r" style="color:#eee">—</td>
        <td class="r" style="color:#eee">—</td>
      </tr>`;
    }
  }

  // Cálculos Fiscales
  let baseImponibleUsd, ivaUsd, totalUsd, baseImponibleBs, ivaBs, totalBs;
  if (inv.tot_fac_bs && inv.tot_fac_usd) {
    baseImponibleBs = Number(inv.base_imponible_bs || (inv.tot_fac_bs / 1.16));
    ivaBs = Number(inv.imp_iva_bs || (inv.tot_fac_bs - baseImponibleBs));
    totalBs = Number(inv.tot_fac_bs);
    baseImponibleUsd = baseImponibleBs / rate;
    ivaUsd = ivaBs / rate;
    totalUsd = Number(inv.tot_fac_usd);
  } else {
    const rawNeto = items.reduce((sum, i) => sum + Number(i.subtotal_usd ?? ((Number(i.price_usd) || 0) * (Number(i.qty) || 0))), 0);
    const descMonto = (o.discount_status === 'approved' && Number(o.discount_pct) > 0) ? (rawNeto * Number(o.discount_pct) / 100) : 0;
    baseImponibleUsd = rawNeto - descMonto;
    ivaUsd = baseImponibleUsd * 0.16;
    totalUsd = baseImponibleUsd + ivaUsd;
    baseImponibleBs = baseImponibleUsd * rate;
    ivaBs = ivaUsd * rate;
    totalBs = totalUsd * rate;
  }

  // Encabezados dinámicos
  let docTitleHeader = 'COMPROBANTE';
  if (isInvoice) docTitleHeader = 'FACTURA FISCAL';
  else if (isQuote) docTitleHeader = 'PRESUPUESTO';
  else if (isReceipt) docTitleHeader = 'ORDEN DE ENTREGA';

  const docNumberMain = o.invoice_number || o.order_number || 'S/N';
  const controlNumber = o.control_number || inv.ncontrol || null;
  const fechaEmision = o.invoice_date || o.created_at;
  const condicionPago = (isInvoice || o.status === 'pagado') ? 'CONTADO' : 'POR CONFIRMAR';

  // Datos Institucionales JJ Paper
  const bizName = s.business_name || 'JJ PAPER, C.A.';
  const bizRif = s.rif || 'J-29537545-0';
  const bizAddr = s.address || 'Av. Principal Colinas de Bello Monte, Edif. Benedetti, Local 2, Caracas';
  const bizPhone = s.phone_display || '+58 412 2830185 / 0212 7531777';
  const bizEmail = s.email || 'jjpaper1@gmail.com';
  const logoUrl  = s.doc_logo_url || 'assets/img/logo.svg';

  return `
  <div class="sheet">
    ${voided ? '<div class="voidmark"><span>ANULADO</span></div>' : ''}

    <!-- CABECERA -->
    <div class="fisc-head">
      <div class="fisc-biz">
        <img src="${escapeHTML(logoUrl)}" alt="Logo JJ Paper">
        <div>
          <div class="biz-name">${escapeHTML(bizName)}</div>
          <div class="biz-rif">R.I.F.: ${escapeHTML(bizRif)}</div>
          <div class="biz-dir">
            <strong>Domicilio Fiscal:</strong> ${escapeHTML(bizAddr)}<br>
            <strong>Teléfonos:</strong> ${escapeHTML(bizPhone)} · <strong>Email:</strong> ${escapeHTML(bizEmail)}
          </div>
        </div>
      </div>

      <!-- CAJA FISCAL SENIAT -->
      <div class="fisc-doc-box">
        <div class="doc-title">${escapeHTML(docTitleHeader)}</div>
        <div class="doc-row num-row">
          <span class="lbl">${isInvoice ? 'FACTURA N°' : 'N° DE CONTROL'}</span>
          <span class="val">${escapeHTML(docNumberMain)}</span>
        </div>
        ${controlNumber ? `
        <div class="doc-row ctrl-row">
          <span class="lbl">N° DE CONTROL SENIAT</span>
          <span class="val">${escapeHTML(controlNumber)}</span>
        </div>` : ''}
        ${(isInvoice && o.order_number && o.order_number !== docNumberMain) ? `
        <div class="doc-row">
          <span class="lbl">N° PEDIDO / VENTA</span>
          <span class="val">${escapeHTML(o.order_number)}</span>
        </div>` : ''}
        <div class="doc-row">
          <span class="lbl">FECHA DE EMISIÓN</span>
          <span class="val">${fmtDate(fechaEmision)}</span>
        </div>
        <div class="doc-row">
          <span class="lbl">CONDICIÓN DE PAGO</span>
          <span class="val">${escapeHTML(condicionPago)}</span>
        </div>
      </div>
    </div>

    <!-- DATOS DEL CLIENTE / RECEPTOR -->
    <div class="fisc-client-box">
      <div class="box-header">
        <span>DATOS DEL CLIENTE / RECEPTOR DE LA FACTURA</span>
        ${cust.code ? `<span>CÓDIGO CLIENTE: <strong>${escapeHTML(cust.code)}</strong></span>` : ''}
      </div>
      <div class="box-body">
        <div class="f-field full">
          <span class="f-lbl">Nombre o Razón Social:</span>
          <span class="f-val" style="font-size:13px;letter-spacing:0.3px">${escapeHTML(cust.name)}</span>
        </div>
        <div class="f-field">
          <span class="f-lbl">R.I.F. / C.I.:</span>
          <span class="f-val">${escapeHTML(cust.rif)}</span>
        </div>
        <div class="f-field">
          <span class="f-lbl">Teléfono(s):</span>
          <span class="f-val">${escapeHTML(cust.phone || 'No especificado')}</span>
        </div>
        <div class="f-field full">
          <span class="f-lbl">Domicilio Fiscal:</span>
          <span class="f-val">${escapeHTML(cust.address || cust.city || 'Caracas, Venezuela')}</span>
        </div>
        ${cust.email ? `
        <div class="f-field full">
          <span class="f-lbl">Correo Electrónico:</span>
          <span class="f-val">${escapeHTML(cust.email)}</span>
        </div>` : ''}
      </div>
    </div>

    <!-- TABLA DE RENGLONES -->
    <table class="fisc-items-table">
      <thead>
        <tr>
          <th class="c" style="width:38px">Ítem</th>
          <th class="c" style="width:105px">Código</th>
          <th>Descripción de la Mercancía</th>
          <th class="c" style="width:58px">Cant.</th>
          <th class="c" style="width:52px">Und.</th>
          <th class="r" style="width:90px">P. Unit. ($)</th>
          <th class="r" style="width:96px">Total ($)</th>
          <th class="r" style="width:115px">Total (Bs.)</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
        ${emptyRows}
      </tbody>
    </table>

    <!-- TOTALES Y LIQUIDACIÓN -->
    <div class="fisc-tot-wrap">
      <div class="fisc-tot-left">
        <strong>INFORMACIÓN DE LIQUIDACIÓN TRIBUTARIA:</strong><br>
        • Tasa de Cambio Oficial BCV: <strong>Bs ${rate.toFixed(2)} por USD</strong>.<br>
        • Alícuota General del I.V.A.: <strong>16.00%</strong>.<br>
        • Mercancía sujeta a verificación física al momento de la recepción conforme.<br>
        ${o.notes ? `<div style="margin-top:6px;padding-top:4px;border-top:1px dashed #cbd5e1"><strong>Observaciones:</strong> ${escapeHTML(o.notes)}</div>` : ''}
      </div>

      <table class="fisc-tot-table">
        <tr>
          <td class="lbl">SUBTOTAL / BASE IMPONIBLE</td>
          <td class="val"><strong>${fmtPrice(baseImponibleUsd)}</strong> &nbsp;|&nbsp; Bs ${fmtBsNum(baseImponibleBs)}</td>
        </tr>
        <tr>
          <td class="lbl">I.V.A. (16.00%)</td>
          <td class="val">${fmtPrice(ivaUsd)} &nbsp;|&nbsp; Bs ${fmtBsNum(ivaBs)}</td>
        </tr>
        <tr class="grand-usd">
          <td class="lbl">TOTAL A PAGAR (USD)</td>
          <td class="val">${fmtPrice(totalUsd)}</td>
        </tr>
        <tr class="grand-bs">
          <td class="lbl">TOTAL FACTURA (Bs.)</td>
          <td class="val">${fmtBsNum(totalBs)} Bs.</td>
        </tr>
        <tr class="rate-row">
          <td class="lbl" style="font-size:10px">TASA BCV APLICADA</td>
          <td class="val" style="font-size:10px">Bs ${rate.toFixed(2)} / USD (Oficial)</td>
        </tr>
      </table>
    </div>

    <!-- ÁREA DE FIRMAS Y CONFORMIDAD -->
    <div class="fisc-sign-area">
      <div class="fisc-sign-box">
        <div class="box-tit">CONFORME CLIENTE / RECEPTOR DE MERCANCÍA</div>
        <div>Nombre y Apellido: _____________________________________________</div>
        <div style="margin-top:4px">C.I. / R.I.F.: ______________________ &nbsp; Fecha: ____________________</div>
        <div class="sign-line"></div>
        <div class="sign-sub">Firma de Conformidad del Receptor</div>
      </div>

      <div class="fisc-sign-box">
        <div class="box-tit">EMISOR / CONTROL ADMINISTRATIVO Y CAJA</div>
        <div>Facturado y Despachado por: <strong>JJ PAPER, C.A.</strong></div>
        <div style="margin-top:4px">Departamento: Facturación, Caja y Almacén Central</div>
        <div class="sign-line"></div>
        <div class="sign-sub">Firma Autorizada y Sello de la Empresa</div>
      </div>
    </div>

    <!-- PIE LEGAL SENIAT -->
    <div class="fisc-footer-note">
      ${isInvoice
        ? `<strong>FACTURA FISCAL OFICIAL N° ${escapeHTML(docNumberMain)}</strong> · Emitida conforme a las Providencias Administrativas del SENIAT mediante sistema administrativo integrado JJ Paper & MixNet. Válida para fines tributarios y contables.`
        : isQuote
          ? `<strong>PRESUPUESTO COMERCIAL</strong> · Documento cotizatorio informativo sin valor fiscal. Precios y disponibilidad sujetos a confirmación a la tasa oficial BCV del día.`
          : `<strong>ORDEN DE ENTREGA / RECIBO INTERNO</strong> · Documento de traslado y recepción conforme de almacén. No sustituye la factura fiscal del SENIAT.`
      }
    </div>
  </div>`;
}
</script>
</body>
</html>
