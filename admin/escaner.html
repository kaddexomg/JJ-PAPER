<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00140f">
<title>Escáner | JJ Paper</title>
<link rel="icon" href="../assets/img/logo.svg">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#00140f; color:#eaf5ee;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; padding:12px; gap:9px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; }
  header img { width:32px; height:32px; }
  header h1 { font-size:16px; margin:0; font-weight:700; }
  header .who { margin-left:auto; font-size:11px; color:#9fc7b3; text-align:right; }

  /* Estado del puente con la PC */
  .link-state { display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:12px; font-weight:600; padding:7px 12px; border-radius:999px;
    max-width:560px; margin:0 auto; width:100%; }
  .link-state.on   { background:rgba(153,204,51,.15); color:#b6e05a; }
  .link-state.wait { background:rgba(201,162,75,.15); color:#e3bd6f; }
  .link-state.off  { background:rgba(220,90,80,.15);  color:#ff9d94; }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
  .link-state.on .dot { animation:pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .cam { position:relative; width:100%; max-width:560px; margin:0 auto; aspect-ratio:3/4;
    max-height:44vh; background:#000; border-radius:16px; overflow:hidden; }
  .cam video { width:100%; height:100%; object-fit:cover; }
  .reticle { position:absolute; inset:26% 12%; border:3px solid #99CC33; border-radius:12px;
    box-shadow:0 0 0 4000px rgba(0,0,0,.25); pointer-events:none; transition:border-color .2s; }
  .cam.hit  .reticle { border-color:#b6e05a; }
  .cam.miss .reticle { border-color:#ffb020; }

  /* Última respuesta de la PC — lo que antes no existía: saber QUÉ escaneaste */
  .feedback { max-width:560px; margin:0 auto; width:100%; border-radius:14px; padding:12px 14px;
    background:#0c231b; border:1px solid #2c5647; min-height:66px;
    display:flex; align-items:center; gap:12px; }
  .feedback.ok  { background:#0e2b1d; border-color:#3f7a3a; }
  .feedback.new { background:#33260f; border-color:#c9902b; }
  .feedback.err { background:#3a1414; border-color:#a34; }
  .fb-icon { font-size:26px; line-height:1; }
  .fb-body { flex:1; min-width:0; }
  .fb-name { font-size:15px; font-weight:700; line-height:1.25; }
  .fb-sub  { font-size:12px; color:#9fc7b3; margin-top:3px; word-break:break-all; }
  .fb-count { font-size:30px; font-weight:800; color:#99CC33; line-height:1; }

  .stats { display:flex; gap:8px; max-width:560px; margin:0 auto; width:100%; }
  .stat { flex:1; background:#0c231b; border:1px solid #1e4033; border-radius:12px;
    padding:8px; text-align:center; }
  .stat b { display:block; font-size:20px; color:#99CC33; line-height:1.1; }
  .stat span { font-size:10px; color:#9fc7b3; }

  .manual { display:flex; gap:8px; width:100%; max-width:560px; margin:0 auto; }
  .manual input { flex:1; height:46px; border-radius:12px; border:1px solid #2c5647;
    background:#0c231b; color:#eaf5ee; padding:0 14px; font-size:16px; }
  .btn { height:46px; border:0; border-radius:12px; font-size:15px; font-weight:700;
    padding:0 16px; cursor:pointer; }
  .btn-p { background:#99CC33; color:#06231a; }
  .btn-g { background:#16604A; color:#eaf5ee; }

  /* Historial de la sesión */
  .hist { max-width:560px; margin:0 auto; width:100%; }
  .hist h2 { font-size:12px; color:#9fc7b3; margin:0 0 6px; font-weight:600; }
  .hist-list { display:flex; flex-direction:column; gap:5px; max-height:26vh; overflow-y:auto; }
  .hist-row { display:flex; align-items:center; gap:8px; font-size:13px;
    background:#0a1d16; border-radius:9px; padding:7px 10px; }
  .hist-row .h-ico { font-size:14px; }
  .hist-row .h-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hist-row .h-n { color:#99CC33; font-weight:700; }

  .foot { text-align:center; font-size:11px; color:#6f9583; padding-top:4px; }
  .warn { background:#3a2410; border:1px solid #c9902b; color:#ffd699; border-radius:12px;
    padding:12px; font-size:14px; text-align:center; max-width:560px; margin:0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../assets/img/logo.svg" alt="JJ Paper">
    <h1>Escáner de inventario</h1>
    <div class="who" id="who">…</div>
  </header>

  <div class="link-state wait" id="linkState"><span class="dot"></span><span id="linkTxt">Conectando con la PC…</span></div>

  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <div class="reticle"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="fb-icon">📦</div>
    <div class="fb-body">
      <div class="fb-name">Listo para escanear</div>
      <div class="fb-sub">Apunta al código de barras del producto</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="stCount">0</b><span>escaneos</span></div>
    <div class="stat"><b id="stItems">0</b><span>productos</span></div>
    <div class="stat"><b id="stQueue">0</b><span>en cola</span></div>
  </div>

  <form class="manual" id="manualForm">
    <input type="text" id="manual" placeholder="O escribe/pega el código…" autocomplete="off" inputmode="numeric">
    <button class="btn btn-p" type="submit">Enviar</button>
  </form>

  <div class="hist">
    <h2>Esta sesión</h2>
    <div class="hist-list" id="hist"></div>
  </div>

  <div class="foot">
    Cada código viaja a tu PC (Inventario → 📷 Modo conteo) en vivo.<br>
    Mantén esta pantalla abierta mientras cuentas.
  </div>
</div>

<div class="toast-c" id="toastC"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/admin/auth.js"></script>
<script>
let escStream = null, escDetector = null, escTimer = null;
let escCount = 0;                          // escaneos enviados
const escSeen = {};                        // code -> última vez visto (anti-doble-lectura)
const escItems = new Set();                // productos distintos reconocidos
let escQueue = [];                         // códigos pendientes de enviar (sin señal)
let escReplyCh = null;                     // canal de respuestas de la PC
let escWakeLock = null;
let escLastAck = 0;                        // última vez que la PC respondió

const $ = id => document.getElementById(id);

document.addEventListener('DOMContentLoaded', async () => {
  // Staff activo (vendedor o admin). Cada quien escanea a su propio nombre.
  const session = await requireAuth('vendedor');
  if (!session) return;
  $('who').textContent = CURRENT_PROFILE?.name || session.user.email;
  $('manualForm').addEventListener('submit', onManual);

  escQueue = JSON.parse(localStorage.getItem('jjp_scan_queue') || '[]');
  renderStats();

  startReplyChannel();
  await keepAwake();
  await startCamera();
  flushQueue();
  setInterval(flushQueue, 5000);           // reintenta lo que quedó sin enviar
  setInterval(refreshLinkState, 3000);
});

// ---- Canal de respuestas: la PC marca cada evento y escribe el resultado ----
function startReplyChannel(){
  escReplyCh = sb.channel('scan-reply-' + CURRENT_PROFILE.id)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'jjp_scan_events',
        filter: 'owner_id=eq.' + CURRENT_PROFILE.id },
      p => onReply(p.new))
    .subscribe(st => setLink(st === 'SUBSCRIBED' ? 'wait' : 'off',
      st === 'SUBSCRIBED' ? 'Esperando a la PC…' : 'Sin conexión con el servidor'));
}

function onReply(row){
  const r = row?.result;
  if (!r) return;
  escLastAck = Date.now();
  setLink('on', 'PC conectada');
  if (r.kind === 'dup') return;            // lectura repetida: no ensucia la pantalla

  const cam = $('cam');
  if (r.ok) {
    escItems.add(r.name || row.code);
    showFeedback('ok', '✅', r.name || 'Producto', 'Contado en la PC', r.counted);
    cam.className = 'cam hit';
    if (navigator.vibrate) navigator.vibrate(40);
    addHist('✅', r.name || row.code, r.counted);
  } else {
    showFeedback('new', '❓', 'Código no registrado', row.code + ' — vincúlalo en la PC');
    cam.className = 'cam miss';
    if (navigator.vibrate) navigator.vibrate([50, 60, 50]);
    addHist('❓', row.code, null);
  }
  setTimeout(() => { cam.className = 'cam'; }, 600);
  renderStats();
}

function refreshLinkState(){
  if (!escLastAck) return;
  // Si la PC dejó de responder por más de 25s, avisa (probablemente cerró el modo conteo)
  if (Date.now() - escLastAck > 25000) setLink('wait', 'PC sin responder — ¿cerraste el modo conteo?');
}

function setLink(kind, txt){
  $('linkState').className = 'link-state ' + kind;
  $('linkTxt').textContent = txt;
}

function showFeedback(kind, icon, name, sub, count){
  $('feedback').className = 'feedback ' + kind;
  $('feedback').innerHTML =
    `<div class="fb-icon">${icon}</div>
     <div class="fb-body">
       <div class="fb-name">${escHtml(name)}</div>
       <div class="fb-sub">${escHtml(sub)}</div>
     </div>` +
    (count != null ? `<div class="fb-count">${count}</div>` : '');
}

function addHist(ico, name, n){
  const el = document.createElement('div');
  el.className = 'hist-row';
  el.innerHTML = `<span class="h-ico">${ico}</span><span class="h-name">${escHtml(name)}</span>` +
    (n != null ? `<span class="h-n">${n}</span>` : '');
  $('hist').prepend(el);
  while ($('hist').children.length > 40) $('hist').lastChild.remove();
}

function escHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderStats(){
  $('stCount').textContent = escCount;
  $('stItems').textContent = escItems.size;
  $('stQueue').textContent = escQueue.length;
}

// ---- Cámara ----
async function startCamera(){
  const video = $('video');
  if (!('BarcodeDetector' in window)) {
    $('cam').insertAdjacentHTML('afterend',
      '<div class="warn">⚠️ Este navegador no soporta escaneo por cámara. ' +
      'Usa <b>Chrome en Android</b>, o escribe/pega el código abajo — igual llega a la PC.</div>');
    showFeedback('', '⌨️', 'Escribe el código', 'Tu navegador no escanea con la cámara');
    $('manual').focus();
    return;
  }
  try {
    const formats = await BarcodeDetector.getSupportedFormats();
    escDetector = new BarcodeDetector({
      formats: formats.length ? formats
        : ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf']
    });
    escStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false
    });
    video.srcObject = escStream;
    await video.play();
    loop();
  } catch (e) {
    console.error(e);
    showFeedback('err', '⚠️', 'Cámara no disponible', 'Revisa los permisos, o escribe el código abajo');
    $('manual').focus();
  }
}

function loop(){
  const video = $('video');
  escTimer = setInterval(async () => {
    if (!escDetector || video.readyState < 2) return;
    let codes = [];
    try { codes = await escDetector.detect(video); } catch (e) { return; }
    const now = Date.now();
    for (const b of codes) {
      const code = (b.rawValue || '').trim();
      if (!code) continue;
      if (escSeen[code] == null) sendCode(code);   // una vez por presentación
      escSeen[code] = now;
    }
    for (const c of Object.keys(escSeen))
      if (now - escSeen[c] > 700) delete escSeen[c]; // re-arma tras salir del cuadro
  }, 250);
}

// La pantalla no se apaga a mitad del conteo
async function keepAwake(){
  try {
    if ('wakeLock' in navigator) {
      escWakeLock = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if (!document.hidden && escWakeLock?.released !== false) {
          try { escWakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }
      });
    }
  } catch (e) {}
}

// ---- Envío (con cola: un pasillo sin señal ya no pierde escaneos) ----
async function sendCode(code){
  beep();
  if (navigator.vibrate) navigator.vibrate(60);
  escCount++;
  renderStats();

  const { error } = await sb.from('jjp_scan_events')
    .insert({ owner_id: CURRENT_PROFILE.id, code, device: navigator.userAgent.slice(0, 60) });

  if (error) {
    escQueue.push(code);
    saveQueue();
    setLink('off', 'Sin señal — ' + escQueue.length + ' en cola, se envían solos');
    showFeedback('err', '📴', 'Guardado en cola', 'Se enviará cuando vuelva la señal');
    renderStats();
  }
}

async function flushQueue(){
  if (!escQueue.length || !navigator.onLine) return;
  const pend = escQueue.slice();
  const rows = pend.map(code => ({ owner_id: CURRENT_PROFILE.id, code }));
  const { error } = await sb.from('jjp_scan_events').insert(rows);
  if (error) return;                        // sigue en cola, se reintenta
  escQueue = escQueue.slice(pend.length);
  saveQueue();
  renderStats();
  if (typeof showToast === 'function') showToast(pend.length + ' escaneo(s) de la cola enviados');
}

function saveQueue(){ localStorage.setItem('jjp_scan_queue', JSON.stringify(escQueue)); }

function onManual(ev){
  ev.preventDefault();
  const inp = $('manual');
  const code = (inp.value || '').trim();
  if (!code) return;
  inp.value = '';
  delete escSeen[code];
  sendCode(code);
}

// Pitido corto vía WebAudio (sin archivos)
let _ac = null;
function beep(){
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.05;
    o.connect(g); g.connect(_ac.destination);
    o.start(); o.stop(_ac.currentTime + 0.08);
  } catch (e) {}
}
</script>
</body>
</html>
